# EZiL Chat image e2e against an already-built desktop digest, without a deploy.
# image.yml runs the same suite on every new image; this workflow lets a change to
# the e2e itself be proven on a PR (or by hand) against a published digest.
name: EZiL Chat e2e

on:
  pull_request:
    paths:
      - 'e2e/copilot-ezil*'
      - '.github/workflows/ezil-chat-e2e.yml'
  workflow_dispatch:
    inputs:
      image:
        description: 'Desktop image reference (digest preferred)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ezil-chat-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: EZiL Chat e2e (published digest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      # The preview image that first carried EZiL Chat (#222/#223, run 39489076217).
      DEFAULT_IMAGE: ghcr.io/ezilhq/ezil-os-desktop@sha256:b82a27e9552fac2168af87e778ac240ab2460fe78daaed1ae08b7e959cfa1385
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the desktop image
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          image="${INPUT_IMAGE:-$DEFAULT_IMAGE}"
          docker pull "$image"
          echo "EZIL_E2E_IMAGE=$image" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-playwright
      - name: EZiL Chat image e2e
        env:
          EZIL_COPILOT_E2E_OUT: ${{ runner.temp }}/ezil-chat-e2e
        run: bash e2e/copilot-ezil-image.sh "$EZIL_E2E_IMAGE"
      - name: Keep EZiL Chat e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezil-chat-e2e
          path: ${{ runner.temp }}/ezil-chat-e2e
          if-no-files-found: warn
