# EZiL Chat image e2e on a PR, without publishing or deploying anything.
# On a PR it builds the desktop image from the PR's own sources on top of the
# published neko overlay (as build-images.sh does) and tests that local image;
# by hand it can instead test any published desktop reference.
# image.yml runs the same suite on every release image.
name: EZiL Chat e2e

on:
  pull_request:
    paths:
      - 'e2e/copilot-ezil*'
      - '.github/workflows/ezil-chat-e2e.yml'
      - 'worker/Dockerfile'
      - 'worker/copilot-chat/**'
      - 'worker/ezil-models/**'
      - 'worker/scripts/editor-state.sh'
      - 'worker/scripts/start-neko.sh'
  workflow_dispatch:
    inputs:
      image:
        description: 'Published desktop image to test instead of building (digest preferred)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ezil-chat-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: EZiL Chat e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make room for the desktop build
        if: inputs.image == ''
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Build the desktop image from this PR (not pushed)
        if: inputs.image == ''
        env:
          EZIL_DEPLOY_SHA: ${{ github.sha }}
        run: |
          GITHUB_OUTPUT=/dev/null node .github/scripts/image-plan.mjs
          overlay="$(jq -r .overlay image-plan.json)"
          docker pull "$overlay"
          docker build --build-arg "NEKO_IMAGE=$overlay" -t ezil-os-desktop:ezil-chat-e2e -f worker/Dockerfile worker
          echo "EZIL_E2E_IMAGE=ezil-os-desktop:ezil-chat-e2e" >> "$GITHUB_ENV"
      - name: Pull the requested published image
        if: inputs.image != ''
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          docker pull "$INPUT_IMAGE"
          echo "EZIL_E2E_IMAGE=$INPUT_IMAGE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-playwright
      - name: EZiL Chat image e2e
        env:
          EZIL_COPILOT_E2E_OUT: ${{ runner.temp }}/ezil-chat-e2e
        run: bash e2e/copilot-ezil-image.sh "$EZIL_E2E_IMAGE"
      - name: Keep EZiL Chat e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezil-chat-e2e
          path: ${{ runner.temp }}/ezil-chat-e2e
          if-no-files-found: warn
