# Called with the admitted source SHA: no independent push/path/tag race.
name: Image
on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
    outputs:
      desktop_ref:
        value: ${{ jobs.images.outputs.desktop_ref }}
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: os-image-publisher
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      desktop_ref: ${{ steps.build.outputs.desktop_ref }}
    env:
      EZIL_DEPLOY_SHA: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: '22.16.0' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - uses: docker/setup-buildx-action@v3
        with: { version: 'v0.25.0' }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Make room for the desktop build on the hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          docker system prune --all --force
      - name: Compute immutable build inputs
        id: plan
        run: |
          test "$(git rev-parse HEAD)" = "$EZIL_DEPLOY_SHA"
          node .github/scripts/image-plan.mjs
      - name: Build missing base, branding and desktop images
        id: build
        run: bash .github/scripts/build-images.sh
      - name: Install test dependencies
        working-directory: worker
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright
      - name: Test this exact desktop digest (no skipped suites)
        env:
          EZIL_VALIDATE_IMAGE: ${{ steps.build.outputs.desktop_ref }}
          EZIL_NEKO_IMAGE: ${{ steps.build.outputs.desktop_ref }}
        run: bash .github/scripts/test-desktop.sh
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Sign tested image identities
        run: |
          for kind in base overlay desktop; do
            ref="$(jq -er --arg key "$kind" '.[$key]' published-images.json)"
            digest="$(jq -er --arg key "${kind}_digest" '.[$key]' published-images.json)"
            cosign sign --yes "${ref%:*}@$digest"
          done
      - name: Attest tested desktop provenance
        if: steps.build.outputs.desktop_built == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/ezilhq/ezil-os-desktop
          subject-digest: ${{ steps.build.outputs.desktop_digest }}
          push-to-registry: true
      - name: Attest base provenance
        if: steps.build.outputs.base_built == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/ezilhq/ezil-neko-vscode
          subject-digest: ${{ steps.build.outputs.base_digest }}
          push-to-registry: true
      - name: Attest overlay provenance
        if: steps.build.outputs.overlay_built == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/ezilhq/ezil-neko-vscode
          subject-digest: ${{ steps.build.outputs.overlay_digest }}
          push-to-registry: true
      - name: Check whether this is still current main
        id: current
        uses: actions/github-script@v8
        with:
          script: |
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            core.setOutput('main', ref.object.sha === process.env.EZIL_DEPLOY_SHA ? 'true' : 'false');
      - name: Advance tested latest for existing public CI consumers
        if: steps.current.outputs.main == 'true'
        env:
          DESKTOP_REF: ${{ steps.build.outputs.desktop_ref }}
        run: |
          docker tag "$DESKTOP_REF" ghcr.io/ezilhq/ezil-os-desktop:latest
          docker push ghcr.io/ezilhq/ezil-os-desktop:latest
      - name: Record tested images
        run: |
          jq '. + {tested: true}' published-images.json > tested-images.json
          printf 'EZIL_DESKTOP_TAG=sha-%s\n' "$EZIL_DEPLOY_SHA" > published-images.env
      - uses: actions/upload-artifact@v4
        with:
          name: os-images-${{ inputs.source }}
          path: |
            tested-images.json
            published-images.env
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: os-image-tests-${{ inputs.source }}
          path: |
            container-junit.xml
            container-test.log
