# Image — publish EZiL OS's two container images to GHCR: the pinned Neko +
# VS Code base/overlay (rarely, only when its build inputs change or forced)
# and the desktop image built from worker/Dockerfile (whenever anything that
# feeds it changes).
#
# ─────────────────────────────────────────────────────────────────────────────
# AMD64 ONLY
# ─────────────────────────────────────────────────────────────────────────────
# Google Chrome ships no arm64 Linux build — worker/Dockerfile installs the
# amd64 .deb directly (see its `google-chrome-stable_current_amd64.deb`
# fetch, worker/Dockerfile:116) — so a multi-arch manifest is not attempted
# anywhere in this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ `paths:` MAY ALSO GATE THE `tags: ['v*']` TRIGGER — DOCUMENTED, NOT MEASURED
# ─────────────────────────────────────────────────────────────────────────────
# GitHub documents `branches`+`paths` on a `push` trigger as ANDed, but does
# not document whether that AND also applies when the ref match came from
# `tags` rather than `branches` — no stated exception either way. Until an
# actual `v*` push is observed on this repository, treat it as ANDed (the
# conservative reading): a `v*` tag pushed at a commit that touches none of
# the paths below may NOT trigger this workflow, and no semver-tagged image
# would be published for it — the image for that release would be whatever
# the most recent path-matching push to `main` already built and pushed under
# its `<git-sha8>` tag. There is no native `on.push` syntax for "these paths
# OR any version tag", and a second workflow file is outside this row's
# `owns_files`. SUPERVISOR STEP: confirm on the first real `v*` tag push
# whether this job actually ran; if it silently didn't, that's the AND.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - worker/**
      - docker/neko/**
      - deploy/images.env
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: 'Force-rebuild the pinned Neko base + branding overlay even if docker/neko/** did not change'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# NOT cancel-in-progress: this workflow pushes an image and only THEN signs
# and attests it. A cancel between push and sign would leave a pushed,
# unsigned image sitting in the registry — deploy.yml's `deploy-production`
# group made the identical choice for the identical reason (see its header).
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  # 🔴 HAND-OFF (T3 -> T0): deploy/images.env's EZIL_NEKO_TAG pins the BARE
  # base only. worker/Dockerfile needs the `-ezil-brandN` OVERLAY of that tag
  # (T0's finding: the bare base lacks the mobile keyboard and the
  # black-picture detector). Until deploy/images.env gains a key for that
  # suffix — proposed: EZIL_NEKO_OVERLAY_TAG=d74052bb-049931d7-ezil-brand8 —
  # this workflow pins the suffix here rather than inventing a second,
  # undocumented source of truth. It MUST stay equal to worker/Dockerfile's
  # own `ARG NEKO_IMAGE` suffix (that file's own 🔴 comment is the authority
  # on when it changes); the "Load image pins" step below fails the build if
  # the two ever disagree.
  NEKO_OVERLAY_SUFFIX: ezil-brand8

jobs:
  neko-base:
    name: neko-base (amd64)
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.pins.outputs.base_ref }}
      overlay_ref: ${{ steps.pins.outputs.overlay_ref }}
      built: ${{ steps.gate.outputs.build }}
      overlay_digest: ${{ steps.push_overlay.outputs.overlay_digest }}
    steps:
      # fetch-depth 0: the change-detection step below diffs against the
      # push's own "before" SHA, which needs history beyond the last commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load image pins
        id: pins
        run: |
          # deploy/images.env is deliberately NOT shell-sourceable: it ships
          # `EZIL_DESKTOP_TAG=<to be pinned by CI>` on purpose (see
          # local/src/container/run-spec.ts's parseImagesEnv doc comment —
          # `<...>` is redirection syntax to a shell). Read it with grep, the
          # same line-parsing contract that function documents, never
          # `source` it. docker/neko/pins.env is ours and safe to source.
          read_env_key() { grep -E "^[[:space:]]*${1}[[:space:]]*=" "$2" | head -1 | cut -d= -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          set -a
          source docker/neko/pins.env
          set +a
          EZIL_NEKO_IMAGE="$(read_env_key EZIL_NEKO_IMAGE deploy/images.env)"
          EZIL_NEKO_TAG="$(read_env_key EZIL_NEKO_TAG deploy/images.env)"
          base_sha8="${NEKO_SHA:0:8}-${NEKO_APPS_SHA:0:8}"
          if [[ "${base_sha8}" != "${EZIL_NEKO_TAG}" ]]; then
            echo "::error::docker/neko/pins.env (${base_sha8}) and deploy/images.env's EZIL_NEKO_TAG (${EZIL_NEKO_TAG}) disagree - bump both together" >&2
            exit 1
          fi
          base_ref="${EZIL_NEKO_IMAGE}:${EZIL_NEKO_TAG}"
          overlay_ref="${EZIL_NEKO_IMAGE}:${EZIL_NEKO_TAG}-${NEKO_OVERLAY_SUFFIX}"
          dockerfile_arg="$(grep -oP '^ARG NEKO_IMAGE=\K.*' worker/Dockerfile)"
          if [[ "${dockerfile_arg}" != "${overlay_ref}" ]]; then
            echo "::error::worker/Dockerfile's ARG NEKO_IMAGE (${dockerfile_arg}) does not match the overlay ref this workflow computed (${overlay_ref}) - bump worker/Dockerfile and NEKO_OVERLAY_SUFFIX together" >&2
            exit 1
          fi
          {
            echo "image=${EZIL_NEKO_IMAGE}"
            echo "base_ref=${base_ref}"
            echo "overlay_ref=${overlay_ref}"
          } >> "$GITHUB_OUTPUT"
          echo "[pins] image=${EZIL_NEKO_IMAGE}"
          echo "[pins] base_ref=${base_ref}"
          echo "[pins] overlay_ref=${overlay_ref}"

      # Needed BEFORE the gate below: the registry-existence probe in "Decide
      # whether to rebuild" has to authenticate to read ghcr.io/ezilhq's
      # package manifests (an anonymous `docker manifest inspect` against
      # this org returns "denied", not a clean 404 — verified locally).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step-level, not job-level: `desktop` below `needs: neko-base`, and a
      # SKIPPED job's dependents are skipped too by default — so this job
      # always runs to completion, and only the expensive steps below are
      # individually gated on this output. See the file header.
      #
      # 🔴 THIS ALSO GUARDS AN IMMUTABLE TAG AGAINST A NON-REPRODUCIBLE BUILD.
      # worker/assets/neko-branding/Dockerfile's own header records the
      # measured fact that rebuilding the pinned base from the SAME pinned
      # SHAs produces a DIFFERENT Vue build (different CSS/JS chunk hashes)
      # — the overlay's asset guard still passes, because it edits index.html
      # in place rather than pinning hashes. So a path-diff or dispatch
      # "please rebuild" is not enough reason to actually push: if the tag
      # already exists in the registry, pushing again would silently replace
      # its bytes under the SAME immutable tag `deploy/images.env` and
      # `worker/Dockerfile` both pin by content. Build only when the tag is
      # genuinely new, or when rebuild_base explicitly says to overwrite it.
      - name: Decide whether to rebuild the base + overlay
        id: gate
        run: |
          request=false
          reason=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.rebuild_base }}" == "true" ]]; then
            request=true
            reason="rebuild_base=true"
          else
            before="${{ github.event.before }}"
            if [[ -z "${before}" || "${before}" == "0000000000000000000000000000000000000000" ]] \
              || ! git cat-file -e "${before}" 2>/dev/null; then
              # New branch, new tag, or a "before" this checkout cannot see
              # (e.g. a force-push, or a tag push whose "before" is the zero
              # SHA): treat as a request rather than risk silently skipping a
              # real change — the existence probe below still protects the
              # immutable tag if nothing actually changed.
              request=true
              reason="no usable 'before' SHA (${before:-<empty>})"
            elif git diff --name-only "${before}" "${{ github.sha }}" -- docker/neko/ | grep -q .; then
              request=true
              reason="docker/neko/** changed"
            fi
          fi

          if [[ "${request}" != "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "[gate] docker/neko/** unchanged, rebuild_base not requested -> skipping"
            exit 0
          fi
          echo "[gate] rebuild requested (${reason}) - checking whether the tags already exist in GHCR..."

          base_ref="${{ steps.pins.outputs.base_ref }}"
          overlay_ref="${{ steps.pins.outputs.overlay_ref }}"
          base_exists=false; overlay_exists=false
          docker manifest inspect "${base_ref}" >/dev/null 2>&1 && base_exists=true
          docker manifest inspect "${overlay_ref}" >/dev/null 2>&1 && overlay_exists=true
          echo "[gate] base_exists=${base_exists} overlay_exists=${overlay_exists}"

          if [[ "${base_exists}" == "true" && "${overlay_exists}" == "true" ]]; then
            if [[ "${{ inputs.rebuild_base }}" == "true" ]]; then
              echo "::warning::rebuild_base=true is REBUILDING an already-published, immutable tag pair (${base_ref}, ${overlay_ref}). The upstream Vue build is documented as NOT reproducible from the same pinned SHAs (worker/assets/neko-branding/Dockerfile's header) - this push may carry different bytes under the SAME tag. Proceeding because it was explicitly requested."
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "[gate] both tags already published and rebuild_base not requested (the diff that triggered this run didn't actually change the pinned SHAs) - skipping to avoid silently overwriting an immutable tag. Set rebuild_base=true to force."
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "[gate] not yet published -> building"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pinned Neko + VS Code base
        if: steps.gate.outputs.build == 'true'
        env:
          NEKO_IMAGE_TAG: ${{ steps.pins.outputs.base_ref }}
        run: docker/neko/build.sh

      # Pushed immediately, BEFORE the overlay build: the overlay's Dockerfile
      # FROMs this exact ghcr.io/... reference by --build-arg below, and a
      # registry-qualified name that only exists in this runner's local store
      # is a different (and less certain) resolution path than one already
      # published — push first so FROM always has a real registry object to
      # resolve, not just a same-runner-local coincidence.
      - name: Push base
        if: steps.gate.outputs.build == 'true'
        id: push_base
        run: |
          base_ref="${{ steps.pins.outputs.base_ref }}"
          base_digest="$(docker push "${base_ref}" | grep -oP 'digest: \Ksha256:[0-9a-f]+')"
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"
          echo "[push] ${base_ref}@${base_digest}"

      - name: Build EZiL branding overlay
        if: steps.gate.outputs.build == 'true'
        run: |
          docker build \
            --build-arg "BASE_NEKO_IMAGE=${{ steps.pins.outputs.base_ref }}" \
            -t "${{ steps.pins.outputs.overlay_ref }}" \
            -f worker/assets/neko-branding/Dockerfile \
            worker/assets/neko-branding

      - name: Push overlay
        if: steps.gate.outputs.build == 'true'
        id: push_overlay
        run: |
          overlay_ref="${{ steps.pins.outputs.overlay_ref }}"
          overlay_digest="$(docker push "${overlay_ref}" | grep -oP 'digest: \Ksha256:[0-9a-f]+')"
          echo "overlay_digest=${overlay_digest}" >> "$GITHUB_OUTPUT"
          echo "[push] ${overlay_ref}@${overlay_digest}"

      - name: Install cosign
        if: steps.gate.outputs.build == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign base + overlay (keyless, OIDC)
        if: steps.gate.outputs.build == 'true'
        run: |
          cosign sign --yes "${{ steps.pins.outputs.base_ref }}@${{ steps.push_base.outputs.base_digest }}"
          cosign sign --yes "${{ steps.pins.outputs.overlay_ref }}@${{ steps.push_overlay.outputs.overlay_digest }}"

      # subject-name is the BARE image name, no tag — the digest is what
      # identifies this exact artifact; base and overlay share one repo name
      # and differ only by tag, so the digest is the only thing distinguishing
      # the two attestations.
      - name: Attest provenance - base
        if: steps.gate.outputs.build == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.pins.outputs.image }}
          subject-digest: ${{ steps.push_base.outputs.base_digest }}
          push-to-registry: true

      - name: Attest provenance - overlay
        if: steps.gate.outputs.build == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.pins.outputs.image }}
          subject-digest: ${{ steps.push_overlay.outputs.overlay_digest }}
          push-to-registry: true

  desktop:
    name: desktop (amd64)
    runs-on: ubuntu-latest
    # neko-base always completes (see the file header) - this job runs on
    # every push that reaches this workflow, whether or not the base rebuilt.
    needs: neko-base
    steps:
      - uses: actions/checkout@v7

      - name: Load image pins
        id: pins
        run: |
          # See the neko-base job's "Load image pins" step: deploy/images.env
          # is grepped, never sourced (it ships a deliberately non-shell-safe
          # placeholder value for EZIL_DESKTOP_TAG).
          read_env_key() { grep -E "^[[:space:]]*${1}[[:space:]]*=" "$2" | head -1 | cut -d= -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          desktop_image="$(read_env_key EZIL_DESKTOP_IMAGE deploy/images.env)"
          echo "desktop_image=${desktop_image}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 HAND-OFF: this job PUBLISHES ghcr.io/ezilhq/ezil-os-desktop:<sha8>
      # but never writes that tag back into deploy/images.env's
      # EZIL_DESKTOP_TAG (still the file's own placeholder,
      # `<to be pinned by CI>`, permissions here are `contents: read` on
      # purpose). run-spec.ts's isDockerTag guard means that placeholder
      # keeps failing closed to LOCAL_DESKTOP_IMAGE_FALLBACK forever until
      # something updates it — no row in docs/TASKS.csv currently owns that
      # write-back (a commit to main from a workflow, or a separate release
      # step). Flagged, not fixed: deploy/images.env is not in this row's
      # owns_files and this workflow has no write access to contents.
      - name: Compute tags
        id: tags
        run: |
          image="${{ steps.pins.outputs.desktop_image }}"
          sha8="${GITHUB_SHA:0:8}"
          declare -a tag_list=("${image}:${sha8}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tag_list+=("${image}:latest")
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            semver="${GITHUB_REF#refs/tags/v}"
            tag_list+=("${image}:${semver}")
          fi
          {
            echo "tags<<TAGSEOF"
            printf '%s\n' "${tag_list[@]}"
            echo "TAGSEOF"
          } >> "$GITHUB_OUTPUT"
          printf '[tags] %s\n' "${tag_list[@]}"

      # provenance: false - attested separately below via
      # actions/attest-build-provenance, keyed off the pushed digest.
      - name: Build and push desktop image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          build-args: |
            NEKO_IMAGE=${{ needs.neko-base.outputs.overlay_ref }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign desktop image (keyless, OIDC)
        run: |
          image="${{ steps.pins.outputs.desktop_image }}"
          digest="${{ steps.build.outputs.digest }}"
          cosign sign --yes "${image}@${digest}"

      - name: Attest provenance - desktop
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.pins.outputs.desktop_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Job summary
        env:
          DESKTOP_TAGS: ${{ steps.tags.outputs.tags }}
          BASE_BUILT: ${{ needs.neko-base.outputs.built }}
          OVERLAY_REF: ${{ needs.neko-base.outputs.overlay_ref }}
          OVERLAY_DIGEST: ${{ needs.neko-base.outputs.overlay_digest }}
          DESKTOP_IMAGE: ${{ steps.pins.outputs.desktop_image }}
          DESKTOP_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tags_csv="$(printf '%s' "${DESKTOP_TAGS}" | paste -sd, -)"
          {
            echo "### Image digests"
            echo
            echo "| image | tag(s) | digest |"
            echo "|---|---|---|"
            if [[ "${BASE_BUILT}" == "true" ]]; then
              echo "| \`${OVERLAY_REF}\` | (rebuilt this run) | \`${OVERLAY_DIGEST}\` |"
            else
              echo "| \`${OVERLAY_REF}\` | (unchanged - not rebuilt this run) | n/a |"
            fi
            echo "| \`${DESKTOP_IMAGE}\` | ${tags_csv} | \`${DESKTOP_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
