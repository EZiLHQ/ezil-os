# Claude review - an on-demand, read-only Claude Code pass over a pull
# request's diff, run only when a maintainer applies the `review:claude`
# label (it already exists: `gh api repos/EZiLHQ/ezil-os/labels`).
#
# -----------------------------------------------------------------------------
# COST - THIS CHARGES THE FOUNDER'S ANTHROPIC KEY, ON PURPOSE LABEL-GATED
# -----------------------------------------------------------------------------
# Every run of this workflow is a real API charge on `secrets.ANTHROPIC_API_KEY`
# (the founder's key). `pull_request_target: types: [labeled]` fires for every
# label applied to every PR - including a stranger's - so the decision of
# WHETHER to spend money lives entirely inside the one step below, gated on
# the exact label name. Nobody except someone who can label a PR (triage/write
# access) can ever cause a charge; a stranger's own push, by itself, cannot.
#
# FOUNDER STEP (one-time, before this workflow can do anything):
#
#   gh secret set ANTHROPIC_API_KEY -R EZiLHQ/ezil-os
#
# Until that secret exists, this workflow is INERT: the gate step below
# detects the empty secret, prints `::notice::ANTHROPIC_API_KEY is not set;
# the review is skipped`, and every later step is skipped too (see the next
# section for why "skipped", not merely "the step that checked exits 0").
#
# -----------------------------------------------------------------------------
# WHY THE GATE IS AN OUTPUT, NOT JUST "exit 0" IN THE CHECKING STEP
# -----------------------------------------------------------------------------
# `exit 0` only ends the step that ran it - it does not stop the job. A step
# that checks the secret and exits 0 would still let the checkout and the
# Claude action run right after it, and the action would then run with an
# empty `anthropic_api_key`, failing loudly on every single labelling instead
# of going quietly inert. So the gate step below does two things: it decides
# (label name AND secret presence) and it writes that decision to
# `$GITHUB_OUTPUT` as `present`; every step after it carries
# `if: steps.gate.outputs.present == 'true'`. A skipped step is not a failure,
# so a wrong label or a missing secret ends the job green with nothing run -
# which is what "inert" has to mean here, not a red job every maintainer
# has to explain away.
#
# The secret is tested with `[ -n "${VAR:-}" ]` (MANDATORY #12's idiom) and is
# never echoed, expanded into a log line, or interpolated into a string.
#
# -----------------------------------------------------------------------------
# WHY pull_request_target, AND WHY THE LABEL EVENT IS THE ONLY TRIGGER
# -----------------------------------------------------------------------------
# Public repo: on plain `pull_request`, a fork PR's `GITHUB_TOKEN` is
# read-only and cannot post a comment - it could never carry out the one
# thing this workflow exists to do. `pull_request_target` runs with the base
# repo's write-capable token instead (see `labeler.yml` and `welcome.yml`'s
# headers for the same reasoning), which is exactly why `types: [labeled]`
# matters: unlike `opened`/`synchronize`, applying a label is an explicit,
# one-at-a-time HUMAN decision by someone with triage/write access on this
# repo - there is no way for an external PR's own commits to cause this
# event by themselves. The gate is enforced twice, independently: this
# workflow's own step-level `if:` on the label name, and (once the action
# actually runs) its own actor-permission check - see
# docs/security.md "Access Control": "The action can only be triggered by
# users with write access to the repository. This is checked for issue,
# pull request, comment, and review events" - the actor GitHub records for a
# `labeled` event is whoever applied the label, i.e. the maintainer, not the
# PR's author.
#
# -----------------------------------------------------------------------------
# CHECKOUT - WHY THIS NEVER CHECKS OUT THE PR'S OWN HEAD (A DELIBERATE
# DEVIATION FROM THIS ROW'S OWN BRIEF, FOLLOWING THE ACTION'S README INSTEAD)
# -----------------------------------------------------------------------------
# This row's brief says: "if it says to check out the PR head, do it with
# `ref: ${{ github.event.pull_request.head.sha }}` and
# `persist-credentials: false`". `anthropics/claude-code-action`'s own
# docs/security.md says the opposite, in a section titled exactly
# "Using this action with `pull_request_target` or `workflow_run`":
#
#   "Do not check out an untrusted ref into the workspace root before this
#   action."
#
#   "Preferred - check out the base ref (default).
#    - uses: actions/checkout@v6 # no `ref:` -> base branch
#    - uses: anthropics/claude-code-action@v1"
#
# Checking out `github.event.pull_request.head.sha` under `pull_request_target`
# into the workspace root is the exact fork-PR privilege-escalation pattern
# this repo's own `labeler.yml` and `welcome.yml` headers already warn about:
# untrusted code landing in a directory a trusted, write-capable token then
# operates from. `persist-credentials: false` narrows that, it does not close
# it - the action itself still runs in that same checkout. So this workflow
# follows the README over its own brief: the checkout step below takes NO
# `ref:` at all, which under `pull_request_target` resolves to the merge-base
# commit on the repo's default branch - the PR's own files never touch disk.
# Read/Grep/Glob (see the tool-restriction section below) therefore only ever
# see the trusted base branch - a PR cannot rewrite the CONTRIBUTING.md rules
# it is being judged against. The diff itself reaches Claude a different way:
# `gh pr diff`/`gh pr view`, read-only calls against the GitHub API, need no
# checkout of anything.
#
# -----------------------------------------------------------------------------
# LEAST PRIVILEGE - WHY `issues: write` FROM THIS ROW'S BRIEF IS DROPPED
# -----------------------------------------------------------------------------
# The brief lists `permissions: {contents: read, pull-requests: write,
# issues: write, id-token: write}`, then also says "only as the action's
# README requires - no more". Every worked review example in the action's own
# docs/solutions.md ("Automatic PR Code Review", "Review PRs from External
# Contributors", both of which use `id-token: write` + a direct
# `anthropic_api_key`, exactly this workflow's auth shape) grants precisely:
#
#   permissions:
#     contents: read
#     pull-requests: write
#     id-token: write
#
# and nothing else. Under this auth path (no custom `github_token` input, so
# the action authenticates as the official Claude GitHub App via the OIDC
# token `id-token: write` provides - docs/setup.md: "The default GitHub App
# authentication path already requires this permission") the token Claude's
# own `gh pr comment`/`gh pr diff` calls use is that GitHub App's own
# installation token, which already carries Issues Read & Write at the app
# level (docs/security.md, "GitHub App Permissions") - independent of this
# job's `permissions:` block, which only governs the checkout step and any
# direct use of `${{ github.token }}` (neither of which touches issues).
# `issues: write` here would be a grant this job never exercises, so it is
# left out rather than carried forward unused - the opposite direction of
# `welcome.yml`'s `issues: write` (that workflow calls
# `github.rest.issues.createComment` directly with `github.token`, a real,
# exercised use of the permission it declares).
#
# `contents: write` is also deliberately not granted: this workflow never
# creates a branch or a commit (see the prompt below - "never pushes"), so
# the checkout step needs read access only.
#
# This auth path was checked against this org, not assumed: `gh api
# orgs/EZiLHQ/installations` (measured 2026-09-05) lists app_id 1236702,
# app_slug "claude", `repository_selection: "all"` - the official Claude
# GitHub App is installed org-wide, so it covers EZiLHQ/ezil-os and the
# OIDC-token-exchange path `id-token: write` enables actually has an
# installation to exchange into. (A prior review pass on this same PR
# proposed swapping to a custom `github_token: ${{ secrets.GITHUB_TOKEN }}`
# on the premise that no such app was installed here - MANDATORY #13:
# checked rather than trusted, and the premise did not hold; comments will
# post as `claude[bot]`, not `github-actions[bot]`.)
#
# -----------------------------------------------------------------------------
# MODEL - CITED FROM ANTHROPIC'S OWN MODEL CATALOG, NOT THE ACTION'S EXAMPLE
# STRING (WHICH IS A PLACEHOLDER, MEASURED, NOT GUESSED)
# -----------------------------------------------------------------------------
# `model` is a deprecated input (docs/usage.md, "Deprecated Inputs": "Use
# `claude_args` with `--model` instead"). That same file's migration example
# writes `claude_args: "--model claude-4-0-sonnet-20250805"` at usage.md:33,
# :67, :104, and :171 - but this is the docs' placeholder for "a model id
# goes here", not a real, current model: examples/claude.yml:47 uses the
# same invented shape one tier up, `claude-opus-4-1-20250805`, both carrying
# the identical, otherwise-unexplained date `20250805`. Anthropic's own
# current model catalog has no `claude-4-0-sonnet-...` or
# `claude-opus-4-1-...` id at all - current-generation ids carry no date
# suffix (`claude-sonnet-5`, `claude-opus-5`, ...; a dated suffix marks an
# older, pinned snapshot). Copying the docs' example literally would fail at
# the API's model lookup on every run, after the founder has already paid
# for the runner. This workflow uses `claude-sonnet-5` - the current Sonnet
# id - instead.
#
# -----------------------------------------------------------------------------
# TOOL RESTRICTION - CITED FROM THE ACTION'S OWN DOCS
# -----------------------------------------------------------------------------
# `allowed_tools` is likewise deprecated in favor of `claude_args` with
# `--allowedTools` (docs/usage.md, same table: "Use `claude_args:
# \"--allowedTools Edit,Read,Write\"`"). This workflow's list is read-only by
# construction: `Read,Grep,Glob` (local files - the trusted base checkout
# only, per above) plus three `gh` subcommands that only ever read from or
# comment on the GitHub API - `Bash(gh pr diff:*)`, `Bash(gh pr view:*)`,
# `Bash(gh pr comment:*)` - mirroring docs/solutions.md's own
# "Automatic PR Code Review" example's `--allowedTools` list (which adds an
# inline-comment MCP tool this workflow does not need, since the brief asks
# for one top-level comment, not scattered inline ones). No `Write`, `Edit`,
# `Bash(git push:*)`, or `gh pr review --approve|--request-changes` is ever
# in this list, which is what makes "never approves, never requests changes
# formally, never pushes" (see the prompt) an enforced constraint and not
# just an instruction Claude is trusted to follow.
#
# -----------------------------------------------------------------------------
# PROMPT INJECTION - THE DIFF IS UNTRUSTED TEXT REACHING A WRITE-CAPABLE JOB
# -----------------------------------------------------------------------------
# docs/security.md, "Prompt Injection Risks": the action's sanitization of
# hidden markdown/HTML in untrusted content is "best-effort... new bypass
# techniques may emerge". This job does hold a token that can post a comment.
# The read-only `--allowedTools` allowlist above is the actual mitigation: the
# worst a successful injection can do here is cause a misleading COMMENT, not
# a write to the repository, a merge decision, or a push - there is no tool
# in the allowlist capable of any of those.
#
# -----------------------------------------------------------------------------
# THIS IS NOT A REQUIRED CONTEXT
# -----------------------------------------------------------------------------
# Must never be added to the branch ruleset on `main` (ruleset 22265548,
# `gh api repos/EZiLHQ/ezil-os/rulesets/22265548`) - an on-demand review
# opinion gates nothing, and it would be absurd for a merge to hang on an
# optional, paid, maintainer-invoked pass the way `dco.yml`'s header
# describes as TRAP 1.
name: Claude review

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the review:claude label and the API key
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          echo "label applied: ${LABEL_NAME}"
          if [ "${LABEL_NAME}" != "review:claude" ]; then
            echo "skip: this label is not review:claude"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "review:claude applied and ANTHROPIC_API_KEY is set - proceeding"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANTHROPIC_API_KEY is not set; the review is skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the base branch
        # Deliberately no `ref:` - see this file's CHECKOUT header section.
        # Resolves to the trusted merge-base commit, never the PR's own head.
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v7

      # anthropics/claude-code-action, pinned to the commit its `v1` tag
      # currently resolves to (v1.0.216), not the floating tag:
      #   gh api repos/anthropics/claude-code-action/git/ref/tags/v1
      #     -> tag object d9a44dc489924665d246f0fd0508d102211be397
      #   gh api repos/anthropics/claude-code-action/git/tags/d9a44dc4...
      #     -> commit d75b94d5ad426cb8546e6628b6f5f19b84e5cce1
      - name: Run the Claude review
        if: steps.gate.outputs.present == 'true'
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1 (v1.0.216)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            A maintainer applied the `review:claude` label to this pull
            request and is asking for a one-time, read-only review pass.
            Fetch the diff with `gh pr diff ${{ github.event.pull_request.number }}`
            and the PR metadata with `gh pr view ${{ github.event.pull_request.number }}`.
            Your own working directory holds only the repository's base
            branch (trusted) - use Read/Grep/Glob against it to check the
            rules below, never against anything the diff itself claims.

            Review the diff strictly against these named rules from
            CONTRIBUTING.md - cite each finding by its rule name:

            1. Sign-off (DCO): every commit needs a `Signed-off-by` trailer
               matching its author (CONTRIBUTING.md#sign-off-dco).
            2. The committed bundle: if `shell/` changed, `app/public/os/bundle.min.js`
               must be rebuilt (`shell/build-shell.sh`) and `shell/build-shell.sh --check`
               must be clean - never hand-edited.
            3. Shell script hygiene: every changed or added `.sh` file must
               pass `bash -n`, and no `.sh` file may contain an apostrophe
               inside a single-quoted `bash -c` block.
            4. ATTRIBUTIONS.md: a new third-party dependency, vendored code,
               or container-image component (including any change to
               `docker.io/cloudflare/sandbox` or the pinned Neko/neko-apps
               commit SHAs in `worker/Dockerfile`) must update ATTRIBUTIONS.md
               in the same PR.
            5. "A skip is not a pass": any test-run evidence in the PR
               description must not treat an absent summary, an unparsable
               count, or a skipped container/browser suite as a pass: each
               skip must be named, and `EZIL_ALLOW_SKIPPED_CONTAINER_TESTS`/
               `EZIL_ALLOW_SKIPPED_BROWSER_SUITES` must never stand in for
               actually running the suite.
            6. PR size: prefer under ~400 changed lines; a PR should split
               along a real seam (one package per PR, schema before code)
               rather than an arbitrary line count, especially past 1000
               changed lines (size/XL).
            7. License of contributions: no code contributed under a license
               incompatible with this project's AGPL-3.0.

            Report your findings as ONE top-level comment
            (`gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`),
            ordered most severe first, each finding quoting the exact
            `path:line` it concerns. If you find nothing wrong against these
            rules, say so plainly in that one comment - do not invent a
            finding to have something to report.

            Do not approve this pull request. Do not request changes as a
            formal review. Do not push a commit, open a branch, or edit any
            file. Post only the one comment described above.

            End your comment with exactly this sentence on its own line:
            "This is an automated pass requested by a maintainer; the maintainer decides."
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
