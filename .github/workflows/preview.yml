# Pushes deploy the selected environment before running its live check.
# Configure staging/production environment secrets and OS_WORKER_URL separately.
# Vercel rootDirectory=app; this workflow owns deployments and preview aliasing.
name: Deploy and live check

on:
  push:
    branches: [preview, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-live-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect container image inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_changed: ${{ steps.image_changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect container image changes
        id: image_changes
        run: |
          set -euo pipefail
          mkdir -p live-evidence
          printf 'source=%s\nbranch=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > live-evidence/run.txt
          before='${{ github.event.before }}'
          # Dispatch has no before SHA. A new branch also needs a complete image.
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --no-renames "$before" "$GITHUB_SHA" > live-evidence/changed-files.txt
            if grep -qE '^worker/(Dockerfile$|neko/|assets/neko-branding/|scripts/)' live-evidence/changed-files.txt; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            else
              echo 'changed=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-changes-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-evidence
          if-no-files-found: warn

  images:
    name: Build and test release images
    needs: changes
    if: >-
      needs.changes.outputs.image_changed == 'true' &&
      (github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      source: ${{ github.sha }}
    secrets: inherit

  preview:
    name: Deploy and verify staging
    needs: [changes, images]
    # A skipped image build must not skip deployments for app/Worker-only pushes.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/preview' &&
          needs.changes.result == 'success' &&
          (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      EZIL_DEPLOY_SHA: ${{ github.sha }}
      EZIL_DEPLOY_TARGET: preview
      EZIL_E2E_WORKER: ${{ vars.OS_WORKER_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Assert preview environment contract
        run: node .github/scripts/env-contract.mjs assert-job --repo ezil-os --environment preview
      - name: Reserve time for deployment and evidence
        id: deadline
        # Leave one minute for runner overhead and evidence upload.
        run: echo "at=$(( $(date +%s) + 24 * 60 ))" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Initialize live evidence
        run: |
          mkdir -p live-evidence
          printf 'source=%s\nbranch=%s\nimage_changed=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" '${{ needs.changes.outputs.image_changed }}' > live-evidence/run.txt
      - name: Install Worker dependencies
        working-directory: worker
        run: bun install --frozen-lockfile
      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Install Vercel CLI
        run: npm install --global vercel@57.0.0
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
      - name: Setup image builder
        if: needs.changes.outputs.image_changed == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          version: 'v0.25.0'
      - name: Log in to the image registry
        if: needs.changes.outputs.image_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download tested candidate image identities
        if: needs.changes.outputs.image_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: os-images-${{ github.sha }}
      - name: Prepare Dockerfile.release from the tested image
        if: needs.changes.outputs.image_changed == 'true'
        run: |
          set -euo pipefail
          node .github/scripts/release-state.mjs prepare
          # prepare changes the default container; staging must use it too.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('worker/wrangler.toml')
          path.write_text(path.read_text().replace('image = "./Dockerfile"', 'image = "./Dockerfile.release"'))
          PY
      - name: Deploy Worker
        id: worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          args=(--env staging)
          rollout=none
          if [[ '${{ needs.changes.outputs.image_changed }}' == true ]]; then rollout=immediate; fi
          remaining=$(( ${{ steps.deadline.outputs.at }} - $(date +%s) - 5 * 60 ))
          (( remaining > 0 )) || { echo '::error::Insufficient time to deploy and recover'; exit 1; }
          timeout --kill-after=10s "${remaining}s" ./node_modules/.bin/wrangler deploy "${args[@]}" --containers-rollout "$rollout" --message "git:$EZIL_DEPLOY_SHA"
      - name: Deploy Vercel preview and set stable alias
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # The Vercel project has rootDirectory=app; upload the repository root.
          url="$(vercel deploy .. --yes --token="$VERCEL_TOKEN" \
            --meta "githubCommitSha=$EZIL_DEPLOY_SHA" \
            --env "CLOUDFLARE_GUACAMOLE_WORKER_URL=$EZIL_E2E_WORKER" \
            --build-env "CLOUDFLARE_GUACAMOLE_WORKER_URL=$EZIL_E2E_WORKER")"
          [[ "$url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]
          vercel alias set "$url" ezil-os-preview.vercel.app --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Check stable preview
        id: live_preview
        timeout-minutes: 9
        env:
          EZIL_E2E_APP: https://ezil-os-preview.vercel.app
          EZIL_E2E_EMAIL: ${{ secrets.EZIL_E2E_EMAIL }}
          EZIL_E2E_PASSWORD: ${{ secrets.EZIL_E2E_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EZIL_LIVE_OUT: live-evidence
        run: node e2e/live-check.mjs
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-evidence
          if-no-files-found: warn

  production:
    name: Deploy and verify production
    needs: [changes, images]
    # A skipped image build must not skip deployments for app/Worker-only pushes.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          needs.changes.result == 'success' &&
          (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      EZIL_DEPLOY_SHA: ${{ github.sha }}
      EZIL_DEPLOY_TARGET: production
      EZIL_E2E_WORKER: ${{ vars.OS_WORKER_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Assert production environment contract
        run: node .github/scripts/env-contract.mjs assert-job --repo ezil-os --environment production
      - name: Reserve time for production recovery
        id: deadline
        # Leave one minute for runner overhead and evidence upload.
        run: echo "at=$(( $(date +%s) + 24 * 60 ))" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Initialize live evidence
        run: |
          mkdir -p live-evidence
          printf 'source=%s\nbranch=%s\nimage_changed=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" '${{ needs.changes.outputs.image_changed }}' > live-evidence/run.txt
      - name: Install Worker dependencies
        working-directory: worker
        run: bun install --frozen-lockfile
      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Install Vercel CLI
        run: npm install --global vercel@57.0.0
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
      - name: Setup image builder
        if: needs.changes.outputs.image_changed == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          version: 'v0.25.0'
      - name: Log in to the image registry
        if: needs.changes.outputs.image_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download tested candidate image identities
        if: needs.changes.outputs.image_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: os-images-${{ github.sha }}
      - name: Prepare Dockerfile.release from the tested image
        if: needs.changes.outputs.image_changed == 'true'
        run: |
          set -euo pipefail
          node .github/scripts/release-state.mjs prepare
          # prepare changes the default container; staging must use it too.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('worker/wrangler.toml')
          path.write_text(path.read_text().replace('image = "./Dockerfile"', 'image = "./Dockerfile.release"'))
          PY
      - name: Record previous Worker version
        id: previous_worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deployments list --json > "$RUNNER_TEMP/worker-deployments.json"
          version="$(jq -er 'sort_by(.created_on) | last | .versions |
            if length == 1 and .[0].percentage == 100 then .[0].version_id
            else error("Expected one active Worker version") end |
            select(test("^[a-f0-9-]{36}$"))' "$RUNNER_TEMP/worker-deployments.json")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$version" > ../live-evidence/previous-worker.txt
      - name: Record previous production deployment
        id: previous_app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const response = await fetch(`https://api.vercel.com/v13/deployments/os.ezil.work?teamId=${encodeURIComponent(process.env.VERCEL_ORG_ID)}`, {
            headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          assert.ok(response.ok, `Vercel capture HTTP ${response.status}`);
          const deployment = await response.json();
          assert.equal(deployment.projectId, process.env.VERCEL_PROJECT_ID);
          assert.equal(deployment.target, 'production');
          assert.equal(deployment.readyState, 'READY');
          assert.match(deployment.id, /^dpl_[a-zA-Z0-9]+$/);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment=${deployment.id}\n`);
          fs.writeFileSync('live-evidence/previous-vercel.txt', `${deployment.id}\n`);
          JS
      - name: Deploy Worker
        id: worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          args=()
          rollout=none
          if [[ '${{ needs.changes.outputs.image_changed }}' == true ]]; then rollout=immediate; fi
          remaining=$(( ${{ steps.deadline.outputs.at }} - $(date +%s) - 5 * 60 ))
          (( remaining > 0 )) || { echo '::error::Insufficient time to deploy and recover'; exit 1; }
          timeout --kill-after=10s "${remaining}s" ./node_modules/.bin/wrangler deploy "${args[@]}" --containers-rollout "$rollout" --message "git:$EZIL_DEPLOY_SHA"
      - name: Deploy Vercel production
        id: production_app
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Keep the same source root as preview and the existing workflows.
          remaining=$(( ${{ steps.deadline.outputs.at }} - $(date +%s) - 5 * 60 ))
          (( remaining > 0 )) || { echo '::error::Insufficient time to deploy and recover'; exit 1; }
          timeout --kill-after=10s "${remaining}s" vercel deploy .. --yes --prod --token="$VERCEL_TOKEN" \
            --meta "githubCommitSha=$EZIL_DEPLOY_SHA" \
            --env "CLOUDFLARE_GUACAMOLE_WORKER_URL=$EZIL_E2E_WORKER" \
            --build-env "CLOUDFLARE_GUACAMOLE_WORKER_URL=$EZIL_E2E_WORKER"
      - name: Check production
        id: live_production
        timeout-minutes: 9
        continue-on-error: true
        env:
          EZIL_E2E_APP: https://os.ezil.work
          EZIL_E2E_EMAIL: ${{ secrets.EZIL_E2E_EMAIL }}
          EZIL_E2E_PASSWORD: ${{ secrets.EZIL_E2E_PASSWORD }}
          EZIL_LIVE_OUT: live-evidence
        run: |
          # A slow build/deploy must not consume the two rollback steps' budget.
          remaining=$(( ${{ steps.deadline.outputs.at }} - $(date +%s) - 4 * 60 ))
          (( remaining > 0 )) || { echo '::error::Live-check budget exhausted'; exit 1; }
          timeout --kill-after=10s "${remaining}s" node e2e/live-check.mjs
      - name: Roll back production Worker
        if: always() && steps.previous_worker.outcome == 'success' && steps.previous_app.outcome == 'success' && (steps.worker.outcome == 'failure' || steps.production_app.outcome == 'failure' || steps.live_production.outcome == 'failure')
        timeout-minutes: 2
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler rollback '${{ steps.previous_worker.outputs.version }}' -y
      - name: Restore previous Vercel production deployment
        if: always() && steps.previous_worker.outcome == 'success' && steps.previous_app.outcome == 'success' && (steps.worker.outcome == 'failure' || steps.production_app.outcome == 'failure' || steps.live_production.outcome == 'failure')
        timeout-minutes: 2
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel promote '${{ steps.previous_app.outputs.deployment }}' --scope "$VERCEL_ORG_ID" --yes --token="$VERCEL_TOKEN"
      - name: Fail after production recovery
        if: always() && steps.previous_worker.outcome == 'success' && steps.previous_app.outcome == 'success' && (steps.worker.outcome == 'failure' || steps.production_app.outcome == 'failure' || steps.live_production.outcome == 'failure')
        run: |
          echo '::error::Production deployment or live check failed; see the preceding rollback results.'
          exit 1
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-evidence
          if-no-files-found: warn
