# All production paths use the current-main CI, staging, image and SQL gates.
name: Deploy App
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: write
  id-token: write
  attestations: write
jobs:
  gated-production:
    uses: ./.github/workflows/preview.yml
    with:
      source: ${{ github.sha }}
    secrets: inherit
