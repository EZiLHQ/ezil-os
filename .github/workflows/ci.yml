# CI — the checks that must pass before anything ships.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS RUNS, AND WHAT IT DELIBERATELY DOES NOT
# ─────────────────────────────────────────────────────────────────────────────
# `worker`, `app`, `connectors` (sdk + mcp) and `shell` each run on a THREE-OS
# matrix (`ubuntu-latest`, `windows-latest`, `macos-latest`, `fail-fast: false`
# so one OS's failure does not hide the other two's results) — every `run:`
# step in those four jobs sets `shell: bash` explicitly, because the default
# shell on a Windows runner is PowerShell, not bash. A matrix job's check-run
# name is `<name> (<matrix.os value>)` — e.g. `worker (typecheck + unit)
# (windows-latest)` — so a required-status list naming the base job names
# alone will not match; it has to name (or wildcard) the OS suffix too.
#
# It also runs three ubuntu-only jobs: `tools` (typecheck + unit — the one
# package with neither a `strategy.matrix` need nor a Windows-portability
# question), and two that pull the REAL published desktop image and run
# against it instead of silently skipping:
#
#   `container` — logs in to GHCR with this workflow's own token, pulls
#   `ghcr.io/ezilhq/ezil-os-desktop:latest` (rows T3/T7 publish it; see
#   "WHICH TAG, AND WHY" below), tags it locally as `ezil-integrated:local`
#   and exports `EZIL_VALIDATE_IMAGE`/`EZIL_NEKO_IMAGE` so it resolves for
#   `worker/src/browser-sidecar.container.test.ts`,
#   `worker/src/neko-browser-window.container.test.ts` and
#   `worker/scripts/mobile-keyboard.container.test.ts` (both env spellings —
#   that file's own header explains why it reads two names), then runs
#   exactly those three suites and hard-fails on ANY skip, not just a
#   failure: a skip here means the image gate above did not see the pulled
#   image, which is a finding about this job, never a pass.
#
#   `local` — installs and typechecks `local/` for real, and pulls the
#   PINNED reference it reads out of `deploy/images.env`
#   (`ghcr.io/ezilhq/ezil-os-desktop:$EZIL_DESKTOP_TAG`), not `latest` and not
#   a re-tag of one — see that job's own comment for why the pin is the only
#   thing that proves anything here. It runs
#   `bun run doctor` (`working-directory: local`) as an independent health
#   check, then
#   `bun test local/` and inspects the result: `bun test` itself exits 0 when
#   tests are SKIPPED, not just when they pass, so a job that only checked the
#   exit code would go green while `local/src/host/docker-host.container.test.ts`
#   and `local/tests/local-smoke.container.test.ts` — the suites that boot a
#   real desktop in a real browser — never ran. This job parses bun's own
#   pass/skip/fail counts and fails outright if anything was skipped, then
#   proves teardown by failing if any `ezil-os-*` container is still running.
#
# ── WHICH TAG, AND WHY: `latest`, NOT `<sha8>` ──────────────────────────────
# `.github/workflows/image.yml` and this workflow trigger off the SAME push
# and run CONCURRENTLY — there is no `needs:`/`workflow_run` between them (see
# each file's own `on:` block) — so the commit's own `<sha8>` tag may not
# exist in GHCR yet by the time this job's pull runs; pinning to `<sha8>`
# would make this job red on a timing coincidence, not a real defect.
# `latest` (moved to the last successful push to `main` by image.yml's
# `desktop` job — see `deploy/images.env`'s own tag-scheme comment) is always
# resolvable once image.yml has run at least once, on every trigger this
# workflow has (`push` to `main` AND `pull_request`, since image.yml never
# runs on a PR — see its own `on:` block). The pulled digest is printed so the
# log names exactly which build was tested; a PR is therefore tested against
# the last GOOD build of `main`, not against its own untested changes to
# `worker/Dockerfile` or `docker/neko/**` — a real gap, called out again in
# the `container` job's own comment.
#
# ── HAND-OFFS FOR THE SUPERVISOR, NOT FIXED IN THIS FILE ───────────────────
#
#   FORK PRs CANNOT PULL THE PRIVATE PACKAGE. `pull_request` runs this
#   workflow with a read-only, fork-scoped `GITHUB_TOKEN` for a fork's PR —
#   that token cannot pull a private `ezilhq/ezil-os-desktop`, so both
#   `container` ("Pull the desktop image") and `local` ("Pull the pinned
#   desktop image") fail at their pull step on every external contribution,
#   regardless of anything the contributor wrote. A contributor who wants to
#   run `local/` on their own machine sets `EZIL_LAUNCHER_IMAGE=<image:tag>`
#   (`local/src/container/run-spec.ts`'s `DESKTOP_IMAGE_OVERRIDE_ENV`, the
#   same variable `deploy/launcher/ezil-os.sh` reads) against an image they
#   built themselves; CI deliberately does not, because this job's job is to
#   prove the PIN resolves. Row G4's required-status list must NOT add "container (real
#   image)" or "local (typecheck + unit + smoke)" until the package is made
#   Public (already tracked as a founder step, docs/ORCHESTRATION-LOG.md
#   2026-09-04 14:50Z) — otherwise no fork PR could ever merge.
#
#   MERGE ORDER WITH ROW M1. `worker/scripts/mobile-keyboard.container.test.ts`
#   is being rewritten on `task/M1` (not yet merged) and, per that file's own
#   `main`-branch version today, is diagnosed-broken independent of the
#   image (row M1's hypothesis (b): a bare `require('playwright')` that
#   cannot resolve it even with `PLAYWRIGHT_REQUIRE_DIR` set — measured on
#   this box: still 0 pass / 8 fail with the variable exported). So this
#   row's own PR will show `container (real image)` RED until M1 lands —
#   expected, and it does not block THIS PR's merge, because neither new
#   display name is in ruleset 22265548 yet. The supervisor should add both
#   exact strings to the ruleset only after the first GREEN `container` run
#   that comes AFTER row M1 merges, not after this row's own PR.
#
# What NONE of the above runs:
#
#   * the CONTAINER tests (`*.container.test.ts`) inside `worker`'s own matrix
#     job. They boot the real neko image with Docker, which only the ubuntu
#     leg even has a daemon for (GitHub's macOS runners have no Docker daemon
#     and Windows runners cannot run a Linux container), and every one still
#     gates on `docker image inspect` and SKIPS rather than fails there —
#     that job never pulls an image (this row's jobs do, below) — which is
#     exactly why the `container` job exists to make those same three suites
#     run for real, and why `local`'s job makes its own skip loud too. A
#     skipped test that looks like a pass is how a suite stops meaning
#     anything.
#
#   * the PRODUCTION suites (`e2e/prod-*.mjs`). They sign in to the live
#     deployment with real credentials and drive a real container. They belong
#     to a deploy, not to a pull request, and they live in `deploy.yml`.
#
# 🔴 The bundle check is not decoration. `app/public/os/bundle.min.js` is
# COMMITTED, and a source change without a rebuild ships the old behaviour while
# every local test passes against the new source. That has happened here. (On
# the Windows leg specifically, this check is SKIPPED for a measured,
# unrelated reason — see the step's own comment below, not this one.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI reads the repository and nothing else. Public repo: `pull_request` runs
# for forks, so the token this grants is the token a stranger's PR gets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker (typecheck + unit)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        shell: bash
        working-directory: worker
        run: bun install --frozen-lockfile
      - name: Typecheck
        shell: bash
        working-directory: worker
        run: bun run typecheck
      - name: Unit tests
        # Runs on all three OSes as of row M4. PR #14's eighth run had 227 macOS
        # failures and this step was gated to Linux while they were understood.
        # They were two things, both now fixed or gated with a MEASURED cause:
        #   * 205 were one missing line. `index.test.ts` loaded `./index` without
        #     registering the workerd-only `cloudflare:workers` specifier, which
        #     bun resolves on NO platform; it passed only when the filesystem's
        #     directory order happened to put a file that DID register it first.
        #     On APFS it went first instead, and bun then served that same
        #     rejection to the four files that were correct. A source pin in
        #     `index.test.ts` now refuses any `./index` loader without a stub.
        #   * 22 were suites executing the container's Ubuntu boot scripts, or
        #     GNU-coreutils commands, against a BSD userland. Row M3 gated most;
        #     row M4 gated the last three (BSD `wc -c` space-pads its count, so
        #     the tail's `bytes=` meta line does not parse — measured with a stub
        #     on Linux, 10 pass / 3 fail, the same three names as the macOS leg).
        # Windows additionally needed CRLF: `.gitattributes` says `* text=auto`, so
        # a Windows checkout writes `.ts` with CRLF and the multi-line source-text
        # regexes in `index.test.ts` (8 failures, PR #14 run 44) and
        # `workspace-idle.test.ts` (2, found by converting the package and running
        # it) stopped matching. Both files now normalise line endings on read.
        shell: bash
        working-directory: worker
        # Container tests skip themselves when Docker has no image (or, on
        # macOS/Windows, no daemon at all); everything else must pass. This
        # includes `shell-scripts-parse.test.ts`, which runs `bash -n` on
        # every shipped `.sh` — on the Windows leg that resolves `bash` from
        # Git for Windows, which every GitHub-hosted Windows runner ships.
        #
        # `--reporter=junit`: bun's default console reporter, MEASURED,
        # prints per-test names for FAILURES only — a fully passing run
        # prints just the ` N pass / N fail` summary, never the individual
        # test names. That is true on every OS, but it means this row's own
        # verify_cmd ("Windows leg log shows bash -n file list") would be
        # unsatisfiable from `bun test` alone even on a green run. The JUnit
        # XML lists every test regardless of outcome; exit code is unchanged
        # by adding a second reporter (measured: still 0 on pass, nonzero on
        # any failure).
        run: bun test --reporter=junit --reporter-outfile=worker-junit.xml
      # Prints exactly the evidence this row's verify_cmd asks for, without
      # dumping the full (much larger) JUnit report into the log.
      - name: Show the bash -n file list (verify_cmd evidence)
        # Runs on all three OSes as of row M4, same as the step above.
        shell: bash
        # Same working directory as the step that wrote it: the report path is
        # relative, because `/tmp` is not a location bun (a native Windows binary,
        # resolving it against the current drive) and Git Bash (MSYS, mapping it
        # into the user's temp) agree on.
        working-directory: worker
        run: |
          echo "bash -n was run, this leg (${{ runner.os }}), against:"
          grep -oE '<testcase name="[^"]*parses under `bash -n`"' worker-junit.xml \
            | sed -E 's/^<testcase name="//; s/"$//'

  app:
    name: app (typecheck + unit)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # bun, not npm: `app/bun.lock` is the committed lockfile and there is no
      # `package-lock.json`, so `npm ci` would fail outright. Node is still set
      # up because the shell suites and `vitest` run under it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        shell: bash
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Typecheck
        shell: bash
        working-directory: app
        # `bun run`, not `npx`: on the Windows runner npx does not resolve the
        # bun-created node_modules/.bin shim and quietly installs an unrelated
        # npm package named `tsc` instead (PR #14, fifth run). bun resolves its
        # own shims on every OS.
        run: bun run typecheck
      # `app/eslint.config.mjs` has existed and been configured all along; it
      # was simply never run by anything. A configured linter nobody runs is a
      # linter that is already failing.
      - name: Lint
        shell: bash
        working-directory: app
        run: bun run lint
      - name: Unit tests
        shell: bash
        working-directory: app
        run: bun run test

  connectors:
    name: sdk + mcp (typecheck + unit)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `sdk/` is checked FIRST and separately from `mcp/`, because `mcp/`
      # depends on it by `file:../sdk` — a break in the SDK should be reported
      # as an SDK failure, not as a confusing downstream one.
      - name: Install (sdk)
        shell: bash
        working-directory: sdk
        run: bun install --frozen-lockfile
      - name: Typecheck (sdk)
        shell: bash
        working-directory: sdk
        run: bun run typecheck
      # Includes `src/surface.test.ts`, the drift guard: it reads the real
      # routers under app/ and fails if this client calls a procedure the
      # server does not have, or if the server grew one nobody decided about.
      - name: Unit tests (sdk)
        shell: bash
        working-directory: sdk
        run: bun test
      - name: Install (mcp)
        shell: bash
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck (mcp)
        shell: bash
        working-directory: mcp
        run: bun run typecheck
      # Includes `src/server.protocol.test.ts`, which drives the real server
      # with a real MCP client over a real transport. Handlers that work and
      # handlers that are correctly registered are different claims.
      - name: Unit tests (mcp)
        shell: bash
        working-directory: mcp
        run: bun test

  shell:
    name: shell (bundle check + browser suites)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # 🔴 The committed bundle must match its sources. Without this a source
      # change without a rebuild ships the OLD behaviour while every other check
      # passes against the NEW source.
      #
      # 🔴 WINDOWS-ONLY EXCLUSION — MEASURED, NOT ASSUMED, AND NOT THIS ROW'S
      # FILE TO FIX. `.gitattributes` (owned by row T0) pins `*.sh`, `*.bash`,
      # `*.mjs`, `*.ps1` and the three committed `app/public/os/*` bundle
      # files to a fixed line ending, but NOT `shell/src/**/*.css`,
      # `shell/src/icons/*.svg`, or `shell/ezil/**/*.js` (non-`.mjs`) — the
      # SOURCES this script reads to rebuild the bundle for comparison.
      # Measured on this repo at commit b4c0c98, with `core.autocrlf=true`
      # (Git for Windows' documented default — the exact fact
      # `.gitattributes`'s own header cites for why `*.sh` needed pinning):
      # those source files check out CRLF, and rebuilding from them produces a
      # `bundle.min.css` and `icons.js` that byte-differ from the LF-built
      # committed copy (`diff -r` exits 1 on `bundle.min.css` and `icons.js`;
      # `bundle.min.js` happens not to differ). That is a false failure of
      # this DRIFT GUARD, not evidence of real drift — the three committed
      # bundle files are `-text` in `.gitattributes` and are therefore
      # byte-identical on every OS's checkout, so the suites below still test
      # the real, unmodified bundle on Windows; only this rebuild-and-compare
      # step is unreliable there. The guard still runs on the other two OSes,
      # so staleness is still caught elsewhere in the matrix.
      #
      # HAND-OFF (not this row's `owns_files`): extend `.gitattributes` to pin
      # `shell/src/**/*.css`, `shell/src/icons/*.svg` and `shell/ezil/**/*.js`
      # (excluding `*.mjs`, already pinned) to `eol=lf` the same way `*.sh` is
      # pinned, then drop this `if:`.
      - name: Committed bundle matches source
        if: runner.os != 'Windows'
        shell: bash
        run: bash shell/build-shell.sh --check
      # 🔴 `shell/` HAS dependencies, and this job never installed them. Five of
      # the six unit suites below `import 'jsdom'`, declared in
      # `shell/package.json` with `shell/bun.lock` beside it. Without this step
      # the second suite dies on ERR_MODULE_NOT_FOUND and the job has been red
      # ever since the suites were added — invisible locally, where
      # `shell/node_modules` already exists.
      - name: Install (shell)
        shell: bash
        working-directory: shell
        run: bun install --frozen-lockfile
      # See .github/actions/setup-playwright/action.yml for why this is a
      # composite action rather than an inline `/opt/ezil-testkit` install:
      # `/opt` does not exist on the Windows or macOS runner images.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          version: '1.62.1'
      - name: Shell unit suites
        shell: bash
        run: |
          set -e
          for t in shell/ezil/apps/desktop-screen-test.mjs \
                   shell/ezil/apps/desktop-close-test.mjs \
                   shell/ezil/apps/code-test.mjs \
                   shell/ezil/apps/preview-focus-test.mjs \
                   shell/ezil/apps/registry-trace-test.mjs \
                   shell/ezil/ui/Settings/settings-test.mjs; do
            echo "── $t"
            node "$t"
          done
      # PLAYWRIGHT_REQUIRE_DIR is exported to $GITHUB_ENV by the Setup
      # Playwright step above — no env: block needed here.
      # Two families. The PORTABLE suites assert behaviour (focus, stacking,
      # paint order, a mobile keyboard) and run on every OS. The GEOMETRY suites
      # assert pixel deltas and settle times of a real Chromium and were designed
      # and measured on Linux; on macOS Chromium the same shell settles at 1919px
      # instead of 1920 and a minimise/restore cycle differs by 5-6px (PR #14,
      # fourth run) — rendering-platform noise, not a product defect, and a
      # threshold tuned per OS would measure nothing. They run on the Linux leg
      # only, by a STEP-level condition (a job-level `if:` would drop the check
      # run the ruleset requires). A geometry claim that must hold on macOS or
      # Windows belongs in a suite written and measured there.
      - name: Shell real-browser suites (portable)
        shell: bash
        run: |
          set -e
          for t in shell/touch-focus-browser-test.mjs \
                   shell/ezil/apps/os-chrome-browser-test.mjs \
                   shell/ezil/apps/mobile-browser-test.mjs \
                   shell/ezil/ui/Settings/stacking-browser-test.mjs \
                   shell/ezil/ui/Settings/late-focus-browser-test.mjs; do
            echo "── $t"
            node "$t"
          done
      - name: Shell real-browser suites (geometry — Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          for t in shell/responsiveness-browser-test.mjs \
                   shell/seam-minimise-browser-test.mjs \
                   shell/window-chrome-browser-test.mjs \
                   shell/phone-stacking-browser-test.mjs \
                   shell/ezil/apps/overlay-paint-browser-test.mjs \
                   shell/ezil/apps/resize-test.mjs; do
            echo "── $t"
            node "$t"
          done

  # ── tools (typecheck + unit) — ubuntu only ──────────────────────────────────
  # `tools/` deliberately has no `node_modules`/lockfile of its own — see
  # `tools/tsconfig.json`'s own comment: it borrows `@types/bun` from
  # `sdk/node_modules/@types`, and its `typecheck` script (`tsc --noEmit`)
  # needs `tsc` itself resolved from `sdk/node_modules/.bin` on PATH (O2's
  # 2026-09-04 hand-off). So: install `sdk/`, put its `.bin` on PATH, run.
  tools:
    name: tools (typecheck + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (sdk)
        shell: bash
        working-directory: sdk
        run: bun install --frozen-lockfile
      - name: Typecheck
        shell: bash
        run: PATH="$PWD/sdk/node_modules/.bin:$PATH" bun run --cwd tools typecheck
      - name: Unit tests
        shell: bash
        run: bun test tools/

  # ── container — pulls the REAL desktop image and runs the container suites
  # for real. ──────────────────────────────────────────────────────────────
  # `worker/Dockerfile:77` builds FROM the EZiL-branded neko+VS Code overlay
  # (see `deploy/images.env`'s pairing rule), and
  # `.github/workflows/image.yml` builds and pushes the desktop image this
  # produces to `ghcr.io/ezilhq/ezil-os-desktop` on every push to `main` that
  # touches `worker/**`, `docker/neko/**`, `deploy/images.env`, or itself
  # (rows T3/T7; first successful push 2026-09-04, run 33858675382). This job
  # pulls that image for real, in place of the placeholder that used to fail
  # on purpose here.
  #
  # 🔴 THE PACKAGE IS PRIVATE — GHCR's default, unchanged by rows T3/T7
  # (docs/ORCHESTRATION-LOG.md, 2026-09-04 14:50Z: an anonymous
  # `docker manifest inspect` against it returns `unauthorized`; making it
  # Public is a manual founder step, tracked separately). A repository's own
  # `GITHUB_TOKEN`, granted `packages: read` at THIS JOB's level (not the
  # workflow's — `permissions:` at the top of this file stays `contents:
  # read` only, since `pull_request` runs this workflow for a fork's PR too),
  # can pull a private package this same repository's own workflow
  # published, PROVIDED the package's own "Actions access" setting still
  # lists this repository — the pull step below fails loudly and names that
  # setting if the pull is refused, rather than a bare docker exit code.
  #
  # See the file header's "WHICH TAG, AND WHY" for why this pulls `latest`,
  # not this commit's own `<sha8>`.
  #
  # `worker/src/browser-sidecar.container.test.ts` and
  # `worker/src/neko-browser-window.container.test.ts` read
  # `EZIL_VALIDATE_IMAGE`, falling back to the literal `ezil-integrated:local`
  # if unset; `worker/scripts/mobile-keyboard.container.test.ts` (row M1)
  # reads `EZIL_VALIDATE_IMAGE` first, then `EZIL_NEKO_IMAGE`, then the same
  # literal fallback — this job sets both env vars AND tags the pulled image
  # under that literal name, so all three suites find it however they were
  # written to look for it.
  #
  # 🔴 SETUP PLAYWRIGHT IS HERE TOO, NOT ONLY IN `shell`/`local` — MEASURED,
  # NOT ASSUMED. `worker/scripts/mobile-keyboard.container.test.ts` spawns
  # `node -e '<script>'` subprocesses whose scripts open with a bare
  # `require('playwright')` — that package is deliberately not a dependency
  # of any `package.json` in this repository (see this action's own header).
  # On `main` today that resolution fails even WITH `PLAYWRIGHT_REQUIRE_DIR`
  # set (measured on this box: `bun test worker/scripts/mobile-keyboard.
  # container.test.ts` with `PLAYWRIGHT_REQUIRE_DIR=/opt/ezil-testkit/
  # node_modules` exported still gives 0 pass / 8 fail — a bare `require`
  # cannot see that variable at all) — this is exactly row M1's diagnosed
  # hypothesis (b): the harness was broken, independent of the product.
  # Row M1's in-flight fix (`task/M1`, not yet merged) rewrites the same
  # helpers to `createRequire(process.env.PLAYWRIGHT_REQUIRE_DIR)('playwright')`,
  # falling back to an honest `SKIP_REASON` naming
  # `$PLAYWRIGHT_REQUIRE_DIR is unset` when neither resolves it. Without this
  # step that fallback fires on every run of this job after M1 merges, the
  # suite SKIPS instead of running, and this job's own hard-fail-on-skip step
  # below would then be permanently red for a reason that has nothing to do
  # with the image this job exists to validate. So: install it here too,
  # even though it changes nothing about today's (pre-M1) red result.
  container:
    name: container (real image)
    runs-on: ubuntu-latest
    # Job-level, not workflow-level: only this job and `local` (below) need
    # `packages: read`, and the workflow-level `permissions:` block above
    # stays `contents: read` for every other job, including on a fork's PR.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 🔴 PULLS THE IMAGE FOR REAL, OR FAILS NAMING WHY — SEE THE JOB HEADER.
      - name: Pull the desktop image
        shell: bash
        run: |
          set -e
          image="ghcr.io/ezilhq/ezil-os-desktop:latest"
          echo "[image] pulling ${image} ..."
          if ! pull_out="$(docker pull "${image}" 2>&1)"; then
            printf '%s\n' "${pull_out}"
            echo "::error::docker pull ${image} was refused. The ezilhq/ezil-os-desktop package publishes PRIVATE by default and this job already has packages: read (see this job's permissions: block), but that alone is not always enough - check the package's own Actions-access setting at https://github.com/orgs/EZiLHQ/packages/container/ezil-os-desktop/settings (Manage Actions access -> this repository at Read), or make the package Public."
            exit 1
          fi
          printf '%s\n' "${pull_out}"
          digest="$(printf '%s\n' "${pull_out}" | grep -oE 'Digest: sha256:[0-9a-f]+' | head -1)"
          echo "[image] tested build: ${image}  ${digest:-<no Digest line printed by docker pull>}"
          # EZIL_VALIDATE_IMAGE is the name every *.container.test.ts in
          # worker/ reads (falling back to the literal ezil-integrated:local
          # if unset); mobile-keyboard.container.test.ts (row M1) also
          # accepts the older EZIL_NEKO_IMAGE spelling as a second fallback -
          # export both so this job's tag is found however a suite was
          # written to look for it.
          docker tag "${image}" ezil-integrated:local
          echo "EZIL_VALIDATE_IMAGE=ezil-integrated:local" >> "$GITHUB_ENV"
          echo "EZIL_NEKO_IMAGE=ezil-integrated:local" >> "$GITHUB_ENV"
      - name: Install (worker)
        shell: bash
        working-directory: worker
        run: bun install --frozen-lockfile
      # See .github/actions/setup-playwright/action.yml, and this job's own
      # header comment above ("SETUP PLAYWRIGHT IS HERE TOO") for why the
      # container job needs this and not only `local`/`shell`.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          version: '1.62.1'
      # 🔴 HARD-FAIL ON A SKIP, NOT JUST ON A FAILURE — same reasoning as the
      # `local` job below, applied to the three suites this job exists to run
      # for real. A skip here means EZIL_VALIDATE_IMAGE / EZIL_NEKO_IMAGE did
      # not resolve to an image these suites recognise (the step above
      # failed, or a suite's own gate found the image missing something it
      # needs — e.g. row M1's branding-overlay check), or that Playwright
      # itself did not resolve (the "SETUP PLAYWRIGHT" step above) — never a
      # pass.
      - name: Container suites (real image)
        shell: bash
        run: |
          if ! bun test --reporter=junit --reporter-outfile=/tmp/container-junit.xml \
              worker/src/browser-sidecar.container.test.ts \
              worker/src/neko-browser-window.container.test.ts \
              worker/scripts/mobile-keyboard.container.test.ts \
              2>&1 | tee /tmp/container-test.log; then
            echo "::error::the container suites failed outright against the real pulled image - see the log above. This is a real product/test defect, not an image-gate problem."
            exit 1
          fi
          if ! grep -qE '^ +[0-9]+ pass$' /tmp/container-test.log; then
            echo "::error::bun's summary line (' N pass') was not found in the output above - the skip check below cannot be trusted (reporter format may have changed; this job runs bun-version: latest). Failing rather than silently reporting green."
            exit 1
          fi
          skip_count="$(grep -oE '^ [0-9]+ skip$' /tmp/container-test.log | grep -oE '[0-9]+' || true)"
          if [ -n "$skip_count" ] && [ "$skip_count" -gt 0 ]; then
            echo "::error::${skip_count} skipped test(s) with the real image present and EZIL_VALIDATE_IMAGE/EZIL_NEKO_IMAGE exported - the image gate above did not see it, or a suite's own image-content check failed. Skip reasons printed by the suites themselves:"
            grep -iE 'SKIPPING|skip reason|not present locally' /tmp/container-test.log || true
            exit 1
          fi

  # ── local (typecheck + unit + smoke) — pulls the real image too ────────────
  local:
    name: local (typecheck + unit + smoke)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 🔴 THIS JOB PULLS THE PIN, NOT `latest` — AND THAT IS THE WHOLE POINT.
      # `local/src/host/docker-host.container.test.ts`,
      # `local/tests/local-smoke.container.test.ts` and `bun run doctor` all
      # resolve their image through `readAndResolveDesktopImage`
      # (`local/src/container/run-spec.ts`), which reads
      # `EZIL_DESKTOP_IMAGE`/`EZIL_DESKTOP_TAG` out of `deploy/images.env`.
      #
      # Until row I0c that file carried `EZIL_DESKTOP_TAG=<to be pinned by CI>`
      # and the resolver quietly substituted the literal
      # `ezil-os-worker-sandbox:ff199202`, so this step pulled `latest` and
      # re-tagged it under that literal to make the suites find something. The
      # comment that stood here claimed the re-tag would become "redundant but
      # harmless" once a human advanced the pin. That was WRONG, and it is the
      # reason this step is rewritten in the same commit as the pin: with a
      # real pin the resolver composes `ghcr.io/ezilhq/ezil-os-desktop:<sha8>`,
      # the doctor inspects THAT reference, and a locally-tagged
      # `ezil-os-worker-sandbox:ff199202` is not it — the doctor would have
      # failed and the container suites would have skipped, on a green pull.
      #
      # So: read the pin the same way `image.yml`'s "Load image pins" step
      # does (grep, never `source` — this file is deliberately not
      # shell-sourceable), check it against Docker's tag grammar before using
      # it, and pull exactly the reference `local/` will resolve. No re-tag.
      # Nothing here sets `EZIL_LAUNCHER_IMAGE`: this job exists to prove the
      # PIN resolves, and an override would prove something else.
      #
      # 🔴 THE PIN, NOT THIS COMMIT'S OWN sha8 — the distinction the file
      # header's "WHICH TAG, AND WHY" is about. `image.yml` runs concurrently
      # with this workflow and never on a `pull_request`, so this commit's own
      # sha8 may not exist in GHCR yet; the pinned sha8 is a tag a PREVIOUS
      # successful `image.yml` run already pushed, is immutable, and is
      # therefore always resolvable. A pin advanced to a tag that was never
      # published makes this step fail loudly — the honest failure, and the
      # reason `deploy/images.env`'s write-back rule says to advance the pin
      # only from a published run's `published-images.env` artifact.
      - name: Pull the pinned desktop image
        shell: bash
        run: |
          set -e
          # Same helper as .github/workflows/image.yml's "Load image pins".
          read_env_key() { grep -E "^[[:space:]]*${1}[[:space:]]*=" "$2" | head -1 | cut -d= -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          desktop_image="$(read_env_key EZIL_DESKTOP_IMAGE deploy/images.env)"
          desktop_tag="$(read_env_key EZIL_DESKTOP_TAG deploy/images.env)"
          if [ -z "${desktop_image}" ] || [ -z "${desktop_tag}" ]; then
            echo "::error::deploy/images.env is missing EZIL_DESKTOP_IMAGE or EZIL_DESKTOP_TAG - local/ resolves its image from those two keys and cannot run without them."
            exit 1
          fi
          # The SAME grammar as run-spec.ts's isDockerTag. Without this a
          # re-introduced placeholder would reach `docker pull` and fail with
          # an error about a reference format, not about the pin.
          if ! printf '%s' "${desktop_tag}" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::deploy/images.env's EZIL_DESKTOP_TAG ('${desktop_tag}') is not a valid Docker tag, so local/ resolves no image at all. Advance the pin from a successful image.yml run's published-images.env artifact (gh run download <run-id> -n published-images.env) - see deploy/images.env's own write-back rule."
            exit 1
          fi
          if [ "${desktop_tag}" = "latest" ]; then
            echo "::error::deploy/images.env pins EZIL_DESKTOP_TAG=latest. A floating tag means two users on 'the same version' run different bytes - see that file's tag-scheme comment. Pin a sha8 or a semver."
            exit 1
          fi
          image="${desktop_image}:${desktop_tag}"
          echo "[image] pulling the PINNED reference ${image} (from deploy/images.env) ..."
          if ! pull_out="$(docker pull "${image}" 2>&1)"; then
            printf '%s\n' "${pull_out}"
            echo "::error::docker pull ${image} was refused. Two causes, in order of likelihood: (1) the ezilhq/ezil-os-desktop package publishes PRIVATE by default and this job already has packages: read (see this job's permissions: block), but that alone is not always enough - check the package's own Actions-access setting at https://github.com/orgs/EZiLHQ/packages/container/ezil-os-desktop/settings (Manage Actions access -> this repository at Read), or make the package Public; (2) the pin in deploy/images.env names a tag image.yml never published - advance it from a successful run's published-images.env artifact."
            exit 1
          fi
          printf '%s\n' "${pull_out}"
          digest="$(printf '%s\n' "${pull_out}" | grep -oE 'Digest: sha256:[0-9a-f]+' | head -1)"
          echo "[image] tested build: ${image}  ${digest:-<no Digest line printed by docker pull>}"
      # `local/tsconfig.json`'s own header comment: its typecheck reaches
      # `app/src/server/shell/boot-payload.ts`, which imports `drizzle-orm`
      # through `app/node_modules` — so `bun run --cwd local typecheck` needs
      # BOTH `local/` and `app/` installed, or it fails on an unresolvable
      # import that has nothing to do with `local/` itself. `bun test local/`
      # has no such dependency (the app import is type-only, erased by bun),
      # but the install is cheap and shared with the typecheck step after it.
      - name: Install (app)
        shell: bash
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Install (local)
        shell: bash
        working-directory: local
        run: bun install --frozen-lockfile
      - name: Typecheck
        shell: bash
        working-directory: local
        run: bun run typecheck
      # See .github/actions/setup-playwright/action.yml for why this is a
      # composite action rather than an inline install: `/opt` does not exist
      # on the Windows or macOS runner images (this job is ubuntu-only, but
      # the action itself is shared with the `shell` job and pinned once).
      # Exports PLAYWRIGHT_REQUIRE_DIR to $GITHUB_ENV — read by
      # `local/tests/local-smoke.container.test.ts` the same way
      # `shell/*-browser-test.mjs` reads it.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          version: '1.62.1'
      # 🔴 EZIL_LOCAL_PORT_OFFSET DELIBERATELY LEFT UNSET.
      # Row T5 needed offset 10000 on the machine it measured on because
      # `supabase-kong` already held 0.0.0.0:8443 there. A GitHub-hosted
      # runner has no such thing running — offset 0 (the doctor's default) is
      # expected to be free. If it is NOT (a future runner image ships
      # something on one of these ports), `bun run doctor` prints exactly
      # which port is busy and exits nonzero on its own; this step does not
      # swallow that, so the job fails naming the real conflict instead of
      # silently picking a different offset no other step agrees on. The
      # container suites below also self-pick a free offset (their own
      # `pickOffset()`) and never read this env var either.
      - name: Doctor
        shell: bash
        working-directory: local
        run: bun run doctor
      # 🔴 HARD-FAIL ON A SKIP, NOT JUST ON A FAILURE.
      # `local/src/host/docker-host.container.test.ts` and
      # `local/tests/local-smoke.container.test.ts` gate on `docker image
      # inspect` for the image `readAndResolveDesktopImage` resolves — since
      # row I0c that is `deploy/images.env`'s PINNED GHCR reference, exactly
      # what the "Pull the pinned desktop image" step above pulled — and SKIP
      # — do not fail — when it is absent. `bun test`'s OWN exit code is 0 on a run with skips and zero
      # failures (measured: a `describe.skipIf(true)` suite exits 0), so
      # without the check below this job would read as fully green while the
      # suites that boot a real desktop in a real browser never ran once. So:
      # capture bun's output, fail on a genuine test failure first, then fail
      # again — loudly — if bun reports any skip at all, now that the image
      # the step above pulled should make every skip avoidable.
      #
      # 🔴 `if ! pipeline; then …` ON PURPOSE, NOT `pipeline; if [ $? … ]`.
      # A `shell: bash` step is invoked by GitHub as
      # `bash --noprofile --norc -eo pipefail {0}` — `-e` and `pipefail` are
      # ALREADY on. A bare `bun test … | tee …` that then exits nonzero would
      # abort the script AT THAT LINE under `-e`, before any code below it
      # (including the custom `::error::` message) ever ran; testing the
      # pipeline's exit status as an `if` condition is exempt from `-e`, so
      # this is the one construct that lets the script keep going long enough
      # to print why.
      - name: Unit tests
        shell: bash
        run: |
          if ! bun test local/ 2>&1 | tee /tmp/local-test.log; then
            echo "::error::bun test local/ failed outright — see the log above."
            exit 1
          fi
          # 🔴 POSITIVE CONTROL, NOT JUST A NEGATIVE ASSERTION. `bun-version:
          # latest` above means bun's summary format is not pinned, and the
          # skip check below trusts a specific format (` N skip`, measured
          # against bun 1.3.14). A silent reporter-format change would make
          # the grep below match nothing, `skip_count` would come back empty,
          # and this job would go green having proven nothing — the exact
          # failure mode this job exists to prevent, reproduced inside its own
          # guard. So: first assert the parser can see ANYTHING in bun's
          # summary at all; only trust "0 skips" once that holds.
          if ! grep -qE '^ +[0-9]+ pass$' /tmp/local-test.log; then
            echo "::error::bun's summary line (' N pass') was not found in the output above — the skip check below cannot be trusted (reporter format may have changed; this job runs bun-version: latest). Failing rather than silently reporting green."
            exit 1
          fi
          skip_count="$(grep -oE '^ [0-9]+ skip$' /tmp/local-test.log | grep -oE '[0-9]+' || true)"
          if [ -n "$skip_count" ] && [ "$skip_count" -gt 0 ]; then
            echo "::error::local/ reported ${skip_count} skipped test(s) with the real image pulled and tagged above — the image gate on docker-host.container.test.ts / local-smoke.container.test.ts did not see it. A skip is not a pass."
            exit 1
          fi
      # 🔴 TEARDOWN PROOF. Every container these suites start is named
      # `ezil-os-<id>` (local/src/container/run-spec.ts:728's
      # CONTAINER_NAME_PREFIX) and each suite's own cleanup is supposed to
      # `docker rm -f` it before it exits — this step is the independent
      # check that it actually happened, not a repeat of the suites' own
      # claim. `if: always()` so it still reports, and still catches a
      # leftover container, even when the Unit tests step above already
      # failed.
      - name: Teardown proof — no ezil-os- container survived
        if: always()
        shell: bash
        run: |
          docker ps -a
          if docker ps -a --format '{{.Names}}' | grep -q '^ezil-os-'; then
            echo "::error::a container named ezil-os-* is still present after the suite run above - teardown did not happen. See the docker ps -a output above."
            exit 1
          fi
