name: macOS Native Internal DMG

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'macos-electron/**'
      - 'native/**'
      - 'extensions/ezil-vscode/**'
      - 'app/public/os/**'
      - 'local/src/boot/**'
      - 'shell/**'
      - '.github/workflows/macos-internal.yml'

permissions:
  contents: read

concurrency:
  group: macos-native-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: exact shared shell + Electron Apple Silicon DMG
    # Standard hosted macos-15 is Apple Silicon for public repositories.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned build tools
        working-directory: macos-electron
        run: |
          test "$(uname -m)" = arm64
          npm install --global npm@11.12.1 --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Unit, migration compatibility and Electron GUI checks
        run: |
          bun install --cwd native --frozen-lockfile --ignore-scripts
          bun run --cwd native typecheck
          bun test native/tests
          bun install --cwd extensions/ezil-vscode --frozen-lockfile --ignore-scripts
          bun run --cwd extensions/ezil-vscode typecheck
          bun test extensions/ezil-vscode/tests
          bun run --cwd extensions/ezil-vscode build
          git diff --exit-code -- extensions/ezil-vscode/dist/extension.js
          npm --prefix macos-electron run check
          npm --prefix macos-electron test
          npm --prefix macos-electron run test:electron
      - name: Package and verify internal ad-hoc DMG
        env:
          EZIL_BUILD_VERSION: 0.0.${{ github.run_number }}
        run: npm --prefix macos-electron run package:internal
      - name: Mandatory packaged offline guest smoke
        run: bash macos-electron/scripts/physical-smoke.sh macos-electron/dist "$RUNNER_TEMP/native-offline-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-offline-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-offline-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ezil-native-${{ github.sha }}-${{ github.run_id }}
          path: |
            macos-electron/dist/*.dmg
            macos-electron/dist/*.sha256
            macos-electron/dist/INVENTORY.json
            macos-electron/dist/SBOM.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
