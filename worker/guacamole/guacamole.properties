# EBuilder — Apache Guacamole web-application configuration (GUACAMOLE_HOME).
#
# Read once at startup by the Guacamole HTML5 client web app (Tomcat, /guacamole/).
# It tells the web app where the native proxy daemon (guacd) lives and where to
# find the file-based user/connection map.
#
# There is NO noVNC/websockify anywhere: the browser speaks the Guacamole
# protocol over a WebSocket tunnel to this web app, which relays to guacd, which
# in turn speaks RFB/VNC to the local x11vnc backend on the Xvfb display.

# ── guacd (native proxy daemon) ──────────────────────────────────────────────
# guacd is started on the loopback interface by start-desktop.sh. Use an IPv4
# literal (not "localhost") so the web app can never resolve to ::1 while guacd
# is bound to IPv4 — a classic silent "connection refused" on dual-stack hosts.
guacd-hostname: 127.0.0.1
guacd-port:     4822

# ── Authentication (built-in file provider) ──────────────────────────────────
# The default authentication provider reads user-mapping.xml from GUACAMOLE_HOME.
# The absolute path is stated explicitly so the map is found regardless of how
# Tomcat resolves GUACAMOLE_HOME at runtime.
basic-user-mapping: /etc/guacamole/user-mapping.xml

# Keep the web app quiet about optional extensions we do not ship (JDBC, LDAP…).
# The file provider above is sufficient for the single local preview connection.
