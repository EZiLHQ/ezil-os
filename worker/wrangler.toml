name = "ezil-os-worker"
main = "src/index.ts"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]

# ── Cloudflare Sandbox container ─────────────────────────────────────────────
# Runs the EBuilder browser-desktop image (Xvfb + Chrome + x11vnc + guacd +
# Tomcat/Apache Guacamole, plus the neko desktop-mode stage). instance_type
# "standard-3" (2 vCPU / 8 GiB / 16 GB disk) — upgraded from standard-1 (user-
# approved) to remove CPU starvation: no GPU in Cloudflare Containers, Chrome
# AND VS Code Electron both run --disable-gpu (see Dockerfile/start-neko.sh),
# so ALL rendering and the WebRTC video encode are software, sharing what was
# previously half a physical core (standard-1) across Xvfb, two Electron/GUI
# apps, and the user's own dev-server compile. Account limits (1,500 vCPU /
# 6 TiB) mean there is no platform ceiling on this — `max_instances` below is
# a self-imposed concurrency cap, not a resource one. Cost/active-hour and the
# standard-1 vs standard-3 comparison are documented in the wave-2 report, not
# repeated here to avoid this comment drifting out of sync with actual
# Cloudflare pricing.
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-3"
max_instances = 20

# ── Durable Object binding (backs each Sandbox container) ─────────────────────
[[durable_objects.bindings]]
class_name = "Sandbox"
name = "Sandbox"

# ── Migration registering the Sandbox DO (SQLite storage) ─────────────────────
[[migrations]]
new_sqlite_classes = ["Sandbox"]
tag = "v1"

# ── R2 bucket binding (credential-less workspace mount path) ─────────────────
# Backs the persistent sandbox workspace. When this binding is present,
# `ensureWorkspaceMount` prefers `@cloudflare/sandbox`'s R2 egress mount mode
# (no S3 access keys needed — the Worker's own R2 binding is used, resolved
# server-side by the Sandbox Durable Object). The `SANDBOX_WORKSPACE_S3_*`
# vars below remain a fallback for endpoints that are not native R2 (e.g.
# local Supabase Storage's S3-compatible endpoint).
[[r2_buckets]]
binding = "SANDBOX_WORKSPACE_R2_BUCKET"
bucket_name = "ezil-sandbox-workspaces"
experimental_remote = true

[dev]
port = 8787
local_protocol = "http"

# ── Neko ICE policy (relay-only, fail-closed) ────────────────────────────────
# `relay` requires a working TURN relay (checkIceConfig fails closed when no
# TURN provider is configured). The neko server sits behind Cloudflare's
# HTTP/WS-only edge with no publicly reachable UDP, so media MUST traverse the
# Cloudflare Realtime TURN relay minted per-session from
# SANDBOX_NEKO_TURN_KEY_ID + SANDBOX_NEKO_TURN_API_TOKEN (secrets, by name).
[vars]
SANDBOX_NEKO_ICE_POLICY = "relay"

# ── Custom domain + preview routes: PREVIEW_ROUTES_DISABLED ──────────────────
# (see `worker/src/index.ts`'s `PREVIEW_ZONE_ROOT` doc comment for the full
# hostname-composition background — `<port>-<sandboxId>-<token>.<host>` — and
# why the sandbox SDK requires a real zone rather than a `*.workers.dev` host.)
#
# 2026-07-31 correction: an earlier version of this file routed
# `*-desktop`/`*-nekodesktop`/`*-app` on **ezil.work** — the company's main
# production website — plus a `custom_domain` entry for `os.ezil.work`. The
# owner has explicitly said: do not touch ezil.work. That routing has been
# removed from this file AND unbound from the zone in Cloudflare (routes,
# custom domain, and the `*.ezil.work` / `os.ezil.work` DNS records this
# feature had added — see the removal commit for the exact API calls run).
# ezil.work's pre-existing production DNS (apex, www, pehlachance.*, MX, etc.)
# was left untouched throughout and is unaffected by this.
#
# No replacement zone has been assigned. All three zones on this Cloudflare
# account were checked and none is safe to route sandbox previews on:
#   ezil.org    — `*.ezil.org/*` is owned by the live production Worker
#                 `cf-guacamole-sandbox` (sandbox.ezil.org). OFF LIMITS
#                 (explicit task boundary — never touch this Worker/route).
#   ezil.work   — the mistake above. Owner: do not touch. OFF LIMITS.
#   zlsocial.ai — considered as a replacement, then independently re-verified
#                 live via the Cloudflare API on 2026-07-31: it has an
#                 orange-clouded (proxied) apex website, a BARE wildcard
#                 `*.zlsocial.ai` CNAME to a live Cloudflare Tunnel
#                 (catch-all — matches any subdomain, including any preview
#                 hostname shape this Worker would mint), and several more
#                 live proxied tunnel CNAMEs (`sandboxes`, `sandboxes-worker`,
#                 `*.sandboxes-worker`, `sparkiq`, `universe-dev`). Any Worker
#                 route added here — even a narrow suffix pattern — could
#                 shadow whatever that catch-all tunnel serves for unmatched
#                 hostnames, which cannot be verified from outside the
#                 tunnel's own ingress config. This fails the "not in use"
#                 bar this zone would need to clear, so it was NOT used.
#
# Until a genuinely unused zone (or an explicit go-ahead on zlsocial.ai after
# inspecting its tunnel ingress rules) is available, the desktop preview
# feature has no custom domain to route on and is intentionally left
# disabled here rather than risk a repeat of the ezil.work mistake. Deploying
# with zero `[[routes]]` entries is safe: it uploads the Worker script but
# binds it to no zone, so it cannot intercept traffic anywhere. See
# `worker/src/index.test.ts`'s drift-guard tests for how this disabled state
# is asserted (they require this exact `PREVIEW_ROUTES_DISABLED` marker to be
# present, so silently losing routes by accident still fails the build).

# HMAC secret for authenticating EBuilder → Worker calls.
# Set in production with:  wrangler secret put SANDBOX_HMAC_SECRET
# When unset (local dev), the Worker skips HMAC verification.
# ── Neko WebRTC / Cloudflare Realtime TURN (secrets by NAME only) ────────────
# `neko` desktop-mode media (VS Code pixels + input) travels over WebRTC, which
# needs a TURN relay behind Cloudflare's HTTP/WS-only edge. The Worker mints
# short-lived, per-session ephemeral credentials at request time from a
# long-lived Cloudflare Realtime TURN key, then passes only the ephemeral
# iceServers into the sandbox process env. The long-lived API token NEVER enters
# source, git, API responses, or logs — set it as a Worker secret by name:
#   wrangler secret put SANDBOX_NEKO_TURN_API_TOKEN   # long-lived TURN key API token (secret)
# The TURN key id is a resource identifier (not a secret); it may be set as a
# secret too, or as a [vars] entry:
#   wrangler secret put SANDBOX_NEKO_TURN_KEY_ID
# Policy + optional TTL bound (defaults/ceiling 1800s = session lifetime):
#   SANDBOX_NEKO_ICE_POLICY        'relay' | 'production' (fail closed w/o TURN) | 'diagnostic' (default)
#   SANDBOX_NEKO_TURN_TTL_SECONDS  optional, clamped to [300, 1800]
#   SANDBOX_NEKO_TURN_URLS         optional static pre-shared TURN URL fallback (non-Cloudflare)
# [vars] intentionally omitted — secrets must not live in source.


# ── S3-compatible workspace bucket (mounted via @cloudflare/sandbox mountBucket) ──
# Set these as wrangler secrets/vars to give each sandbox a persistent,
# S3-backed workspace (source of truth after first-seed). Names are generic
# so any S3-compatible endpoint works (Cloudflare R2, AWS S3, local Supabase
# Storage's S3-compatible endpoint for dev, etc.) — prefixed
# `SANDBOX_WORKSPACE_S3_*` to avoid colliding with unrelated AWS/Bedrock vars.
#   wrangler secret put SANDBOX_WORKSPACE_S3_ENDPOINT
#   wrangler secret put SANDBOX_WORKSPACE_S3_BUCKET
#   wrangler secret put SANDBOX_WORKSPACE_S3_ACCESS_KEY_ID
#   wrangler secret put SANDBOX_WORKSPACE_S3_SECRET_ACCESS_KEY
# Optional:
#   SANDBOX_WORKSPACE_S3_PREFIX     — override the per-sandbox prefix (defaults to `/<sandboxId>`)
#   SANDBOX_WORKSPACE_S3_PROVIDER   — 's3' | 'r2' | 'gcs' (defaults to 's3')
#   SANDBOX_WORKSPACE_MOUNT_PATH    — in-container mount point (defaults to `/workspace`)
# When unset, the Worker skips the workspace bucket mount entirely (desktop
# preview still works; no persistent workspace is attached).
