name = "ezil-os-worker"
main = "src/index.ts"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]

# `workers_dev` defaults to disabled the moment any `[[routes]]` is present
# (see the routes block below), so keep it explicit — the `*.workers.dev` host
# stays reachable as a DIAGNOSTIC entrypoint (`GET /health` answers there).
#
# It is NOT the app's entrypoint, and must never be put in
# `CLOUDFLARE_GUACAMOLE_WORKER_URL`. `normalizeSandboxHostname()` derives each
# sandbox's preview hostname from the INBOUND request's own Host, so a
# workers.dev caller mints workers.dev preview hosts and `exposePort()` throws
# ("Port exposure requires a custom domain") after the container has already
# booted. The app must call this Worker on a host that one of the routes below
# matches; the committed value is `https://api-desktop.ezil.org` (see
# `app/.env.example` and `README.md`).
workers_dev = true

# ── Cloudflare Sandbox container ─────────────────────────────────────────────
# Runs the EBuilder browser-desktop image (Xvfb + Chrome + x11vnc + guacd +
# Tomcat/Apache Guacamole, plus the neko desktop-mode stage). instance_type
# "standard-3" (2 vCPU / 8 GiB / 16 GB disk) — upgraded from standard-1 (user-
# approved) to remove CPU starvation: no GPU in Cloudflare Containers, Chrome
# AND VS Code Electron both run --disable-gpu (see Dockerfile/start-neko.sh),
# so ALL rendering and the WebRTC video encode are software, sharing what was
# previously half a physical core (standard-1) across Xvfb, two Electron/GUI
# apps, and the user's own dev-server compile. Account limits (1,500 vCPU /
# 6 TiB) mean there is no platform ceiling on this — `max_instances` below is
# a self-imposed concurrency cap, not a resource one. Cost/active-hour and the
# standard-1 vs standard-3 comparison are documented in the wave-2 report, not
# repeated here to avoid this comment drifting out of sync with actual
# Cloudflare pricing.
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-3"
max_instances = 20
# ── Rollout: replace EVERY instance in one step ───────────────────────────────
# 🔴 THE DEFAULT SILENTLY STRANDS DEPLOYS, AND IT DID. Without these keys
# Cloudflare runs a two-step progressive rollout (10%, then 100%), and step 1
# only completes once it observes a HEALTHY instance on the new version. These
# containers are Durable-Object-pinned and start on demand, so an idle fleet
# sits `inactive`, no new-version instance ever becomes healthy, and the rollout
# parks at 10% indefinitely.
#
# Measured 2026-08-19: a deploy at 12:30 was still reporting
#   status=progressing, step 1 of 2, target_version_instances=1,
#   current_version_instances=6, "healthy target instances observed = 0"
# 45 minutes later, with all live instances still on a two-week-old image. The
# deploy reported SUCCESS and pushed the image correctly — it simply was not
# serving anyone. Every "the fix isn't working in production" symptom that
# afternoon traced back to this and nothing else.
#
# `rollout_step_percentage = 100` makes it a single step, so a deploy either
# takes effect or fails visibly instead of half-landing. `rollout_kind` stays
# automatic. The grace period is what protects a user mid-session: an ACTIVE
# instance is given this long to finish before it is replaced, so "replace
# everything at once" does not mean "yank a running desktop". 300s comfortably
# exceeds a cold boot (~22s measured) and a normal interaction.
rollout_step_percentage = 100
rollout_kind = "full_auto"
rollout_active_grace_period = 300

# ── Durable Object binding (backs each Sandbox container) ─────────────────────
[[durable_objects.bindings]]
class_name = "Sandbox"
name = "Sandbox"

# ── Migration registering the Sandbox DO (SQLite storage) ─────────────────────
[[migrations]]
new_sqlite_classes = ["Sandbox"]
tag = "v1"

# ── R2 bucket binding (credential-less workspace mount path) ─────────────────
# Backs the persistent sandbox workspace. When this binding is present,
# `ensureWorkspaceMount` prefers `@cloudflare/sandbox`'s R2 egress mount mode
# (no S3 access keys needed — the Worker's own R2 binding is used, resolved
# server-side by the Sandbox Durable Object). The `SANDBOX_WORKSPACE_S3_*`
# vars below remain a fallback for endpoints that are not native R2 (e.g.
# local Supabase Storage's S3-compatible endpoint).
[[r2_buckets]]
binding = "SANDBOX_WORKSPACE_R2_BUCKET"
bucket_name = "ezil-sandbox-workspaces"
experimental_remote = true

# ── R2 bucket binding (fleet crash-telemetry spool) ───────────────────────────
# Backs the boot-phase/crash telemetry pipeline (see
# docs/telemetry-design.md, section 4.1, and src/telemetry.ts).
# Deliberately a SEPARATE bucket from SANDBOX_WORKSPACE_R2_BUCKET above: that
# one is FUSE-mounted into user containers, and a mount that ever resolved
# without a per-computer prefix would put the whole fleet's error log inside a
# user's file manager. This binding is optional at runtime — spoolTelemetry()
# in index.ts silently no-ops when it is absent (local dev, or before the
# bucket is provisioned), so telemetry never becomes a hard dependency of the
# preview path. Requires the bucket to exist before deploy:
#   wrangler r2 bucket create ezil-telemetry-spool
[[r2_buckets]]
binding = "TELEMETRY_R2_BUCKET"
bucket_name = "ezil-telemetry-spool"
experimental_remote = true

[dev]
port = 8787
local_protocol = "http"

# ── Neko ICE policy (relay-only, fail-closed) ────────────────────────────────
# `relay` requires a working TURN relay (checkIceConfig fails closed when no
# TURN provider is configured). The neko server sits behind Cloudflare's
# HTTP/WS-only edge with no publicly reachable UDP, so media MUST traverse the
# Cloudflare Realtime TURN relay minted per-session from
# SANDBOX_NEKO_TURN_KEY_ID + SANDBOX_NEKO_TURN_API_TOKEN (secrets, by name).
[vars]
# ── The default desktop mode ─────────────────────────────────────────────────
#
# 🔴 SET BECAUSE IT WAS NOT, and the omission broke the troubleshoot restart in
# production. `resolveDesktopMode(requested, envDefault)` falls back to
# `'guacamole'` when both are absent, and this key was never set — so the
# Worker's idea of "what this deployment runs" was guacamole while every
# desktop it actually serves is neko.
#
# Mostly invisible, because the app always asks for a mode explicitly. The one
# caller that does NOT is the restart: it deliberately omits `desktopMode` so
# the Worker AUTO-DETECTS what is running, and detection only works while a
# desktop port is exposed. When nothing is exposed — a stopped container, an
# idle one, or one already mid-restart — detection finds nothing, falls back to
# this default, sees `guacamole`, and refuses with `unsupported_mode`.
#
# So restart failed exactly when the desktop was NOT running, which is the only
# time anyone reaches for it. Measured in production against the live Worker:
#
#     POST /api/shell/restart -> 200 {"ok":false,"errorCode":"unsupported_mode"}
#
# and, on a cold container, the app's 120s budget expiring first:
#
#     [cloudflare-guacamole] restart request failed (non-fatal):
#       error: 'The operation was aborted due to timeout'
#
# Naming the real default is the fix; the fallback stays `guacamole` in code so
# a deployment that genuinely runs guacamole is unaffected.
SANDBOX_DEFAULT_DESKTOP_MODE = "neko"

SANDBOX_NEKO_ICE_POLICY = "relay"

# ── Custom domain + preview routes: LIVE on ezil.org (narrow suffix routes) ──
# (see `worker/src/index.ts`'s `PREVIEW_ZONE_ROOT` doc comment for the full
# hostname-composition background — `<port>-<sandboxId>-<token>.<host>` — and
# why the sandbox SDK requires a real zone rather than a `*.workers.dev` host.)
#
# 2026-07-31 correction (superseded below): an earlier version of this file
# routed `*-desktop`/`*-nekodesktop`/`*-app` on **ezil.work** — the company's
# main production website — plus a `custom_domain` entry for `os.ezil.work`.
# The owner said not to touch ezil.work; that routing was removed from this
# file AND unbound from the zone in Cloudflare. ezil.work remains untouched
# and off-limits.
#
# 2026-07-31, later same day — owner-approved narrow suffix routes on
# **ezil.org**: `ezil.org` is production's zone — `*.ezil.org/*` is bound to
# the live `cf-guacamole-sandbox` Worker (serves `sandbox.ezil.org` and
# `neko.ezil.org`; NEVER touch that Worker or its route). The owner approved
# adding narrow, token-scoped suffix routes alongside it — `*-app.ezil.org/*`,
# `*-desktop.ezil.org/*`, `*-nekodesktop.ezil.org/*` — on the basis that
# Cloudflare Workers routes match most-specific-first: a longer/more specific
# pattern always wins over a shorter wildcard for the hosts it covers, so
# these three suffix patterns win ONLY for hosts literally ending in
# `-app`/`-desktop`/`-nekodesktop` before `.ezil.org`, and every other
# `*.ezil.org` host (including `sandbox.ezil.org`/`neko.ezil.org`, which do
# not end in any of those suffixes) keeps resolving to the existing
# `*.ezil.org/*` route unchanged. No DNS change was needed: the zone's
# existing orange-clouded `*.ezil.org` wildcard A record already proxies
# every subdomain (that's how `sandbox`/`neko` reach the Worker today with no
# dedicated DNS record of their own), so a preview hostname under any of
# these three suffixes reaches Cloudflare's edge the same way and the route
# table alone decides which Worker answers.
#
# Rolled out ONE route at a time with a live-request diff before/after each
# addition (see the worker README / rollout notes for the verification
# transcript). Only zones this project controls are used for this feature; a
# zone that already has a broad wildcard catch-all is not a safe host for it.
#
# `worker/src/index.test.ts`'s drift-guard tests assert `PREVIEW_ZONE_ROOT` in
# `index.ts` and every token (`desktop`/`nekodesktop`/`app`/`code`) from
# `desktop-mode.ts`'s `portFor`/`appPortFor`/`codePortFor` has a matching route
# pattern here — and, in the other direction, that no route here binds a token
# the Worker cannot mint. So an accidentally-dropped route, a newly added
# exposed-port token with no matching route, and a stale orphan route all fail
# the build loudly instead of silently 404ing (or silently shadowing something)
# in production.
[[routes]]
pattern = "*-app.ezil.org/*"
zone_name = "ezil.org"

[[routes]]
pattern = "*-desktop.ezil.org/*"
zone_name = "ezil.org"

[[routes]]
pattern = "*-nekodesktop.ezil.org/*"
zone_name = "ezil.org"

# `*-code.ezil.org/*` — the code-server (VS Code Web) bridge host,
# `<CODE_PREVIEW_PORT>-<sandboxId>-code.ezil.org` (`desktop-mode.ts`'s
# `codePortFor`, port 8443). Same narrow-suffix, most-specific-wins rationale
# as the three routes above: it matches ONLY hosts literally ending in `-code`
# before `.ezil.org`, so `sandbox.ezil.org` / `neko.ezil.org` and the existing
# `*.ezil.org/*` binding on the legacy `cf-guacamole-sandbox` Worker are
# untouched. Every request on this host is answered by `handleCodeBridge`
# (`src/index.ts`) behind the `ezil_preview` cookie / `ezil_pv` gate — it never
# falls through to `proxyToSandbox`'s raw forward, which matters more here than
# anywhere else because code-server runs `--auth none` inside the container.
[[routes]]
pattern = "*-code.ezil.org/*"
zone_name = "ezil.org"

# HMAC secret for authenticating EBuilder → Worker calls.
# Set in production with:  wrangler secret put SANDBOX_HMAC_SECRET
# When unset (local dev), the Worker skips HMAC verification.
# ── Neko WebRTC / Cloudflare Realtime TURN (secrets by NAME only) ────────────
# `neko` desktop-mode media (VS Code pixels + input) travels over WebRTC, which
# needs a TURN relay behind Cloudflare's HTTP/WS-only edge. The Worker mints
# short-lived, per-session ephemeral credentials at request time from a
# long-lived Cloudflare Realtime TURN key, then passes only the ephemeral
# iceServers into the sandbox process env. The long-lived API token NEVER enters
# source, git, API responses, or logs — set it as a Worker secret by name:
#   wrangler secret put SANDBOX_NEKO_TURN_API_TOKEN   # long-lived TURN key API token (secret)
# The TURN key id is a resource identifier (not a secret); it may be set as a
# secret too, or as a [vars] entry:
#   wrangler secret put SANDBOX_NEKO_TURN_KEY_ID
# Policy + optional TTL bound (defaults/ceiling 1800s = session lifetime):
#   SANDBOX_NEKO_ICE_POLICY        'relay' | 'production' (fail closed w/o TURN) | 'diagnostic' (default)
#   SANDBOX_NEKO_TURN_TTL_SECONDS  optional, clamped to [300, 1800]
#   SANDBOX_NEKO_TURN_URLS         optional static pre-shared TURN URL fallback (non-Cloudflare)
# [vars] intentionally omitted — secrets must not live in source.


# ── S3-compatible workspace bucket (mounted via @cloudflare/sandbox mountBucket) ──
# Set these as wrangler secrets/vars to give each sandbox a persistent,
# S3-backed workspace (source of truth after first-seed). Names are generic
# so any S3-compatible endpoint works (Cloudflare R2, AWS S3, local Supabase
# Storage's S3-compatible endpoint for dev, etc.) — prefixed
# `SANDBOX_WORKSPACE_S3_*` to avoid colliding with unrelated AWS/Bedrock vars.
#   wrangler secret put SANDBOX_WORKSPACE_S3_ENDPOINT
#   wrangler secret put SANDBOX_WORKSPACE_S3_BUCKET
#   wrangler secret put SANDBOX_WORKSPACE_S3_ACCESS_KEY_ID
#   wrangler secret put SANDBOX_WORKSPACE_S3_SECRET_ACCESS_KEY
# Optional:
#   SANDBOX_WORKSPACE_S3_PREFIX     — override the per-sandbox prefix (defaults to `/<sandboxId>`)
#   SANDBOX_WORKSPACE_S3_PROVIDER   — 's3' | 'r2' | 'gcs' (defaults to 's3')
#   SANDBOX_WORKSPACE_MOUNT_PATH    — in-container mount point (defaults to `/workspace`)
# When unset, the Worker skips the workspace bucket mount entirely (desktop
# preview still works; no persistent workspace is attached).

# ── Workers Logs: retained, queryable, and the reason we can look BACKWARDS ───
# `wrangler tail` is a live stream and nothing more: close the terminal and the
# evidence is gone. Every diagnosis this project has made from Worker behaviour
# so far has depended on someone happening to be tailing at the moment a defect
# fired — which is not a strategy, and twice this month meant a failure could
# only be described after it had been reproduced on purpose.
#
# With this enabled, invocation logs are retained and queryable in the dashboard
# and over the API, so a user report at 14:00 can be answered at 18:00. The
# sampling rate is 1.0 deliberately: this is a low-traffic service where the rare
# event IS the interesting one, and sampling would preferentially discard it.
[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
invocation_logs = true
